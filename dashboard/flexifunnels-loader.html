<!-- Webinar Autopilot - FlexiFunnels LOADER. Paste this whole block into a FlexiFunnels Custom Code element ONCE.
     Every time the page opens it loads the LATEST dashboard from GitHub, so every push shows up here automatically.
     Sources, in order:
       1. GitHub (public repo)  - raw dashboard/index.html from the main branch
       2. GitHub (private repo) - the same file through the GitHub API, using the token saved in the dashboard's settings
       3. Vercel                - the Vercel deployment (also updates on every push)
     Only edit the three lines marked EDIT if the repo or Vercel address ever changes. -->
<div id="webinar-autopilot-root"><div id="wa-loading">Loading Webinar Autopilot...</div></div>
<style>
  html, body { margin: 0 !important; padding: 0 !important; overflow: hidden !important; background: #0C0E13 !important; }
  #webinar-autopilot-root { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
    width: 100vw !important; height: 100vh !important; max-width: none !important; max-height: none !important; margin: 0 !important; padding: 0 !important;
    transform: none !important; z-index: 2147483000 !important; background: #0C0E13 !important; display: block !important; }
  #webinar-autopilot-root > iframe { position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important;
    max-width: none !important; max-height: none !important; min-width: 0 !important; margin: 0 !important; padding: 0 !important;
    border: 0 !important; display: block !important; background: #0C0E13 !important; transform: none !important; }
  #wa-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8E94A3;
    font: 500 13px/1.6 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 24px; }
  #wa-loading b { color: #D6F23C; }
</style>
<script>
(function () {
  var REPO = 'Sarthak-B/webinar-chat-automation';                    // EDIT if the repo moves
  var BRANCH = 'main';                                                // EDIT if the branch changes
  var VERCEL_URL = 'https://webinar-chat-automation.vercel.app/';     // EDIT if the Vercel address changes ('' = don't use)
  var FILE = 'dashboard/index.html';

  var root = document.getElementById('webinar-autopilot-root');
  if (!root || root.getAttribute('data-ready')) return;
  root.setAttribute('data-ready', '1');
  if (root.parentNode !== document.body) document.body.appendChild(root); // escape builder sections that clip/shrink
  var m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex,nofollow'; document.head.appendChild(m);
  document.title = 'Webinar Autopilot | FlexiFunnels';

  function frame() {
    var f = document.createElement('iframe');
    f.title = 'Webinar Autopilot';
    f.setAttribute('allow', 'clipboard-read; clipboard-write');
    return f;
  }
  function show(html) {       // same origin as this page -> settings, GitHub/Apps Script calls and copy buttons work
    var f = frame(); f.srcdoc = html; root.innerHTML = ''; root.appendChild(f);
  }
  function showUrl(url) {
    var f = frame(); f.src = url; root.innerHTML = ''; root.appendChild(f);
  }
  function fail() {
    root.innerHTML = '<div id="wa-loading">Could not load the dashboard.<br>Check that the repo <b>' + REPO +
      '</b> exists and is public, or open the dashboard once and save a GitHub token in its settings.</div>';
  }
  function looksRight(t) { return t && t.indexOf('Webinar Autopilot') !== -1 && t.indexOf('<html') !== -1; }
  function savedToken() {
    try { var c = JSON.parse(localStorage.getItem('autopilot.cfg') || '{}'); return c.token || ''; } catch (e) { return ''; }
  }

  // 1. public repo
  fetch('https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/' + FILE + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .catch(function () { return ''; })
    .then(function (t) {
      if (looksRight(t)) return show(t);
      // 2. private repo, with the token saved in the dashboard's settings
      var token = savedToken();
      var viaApi = token
        ? fetch('https://api.github.com/repos/' + REPO + '/contents/' + FILE + '?ref=' + BRANCH, {
            headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.raw+json', 'X-GitHub-Api-Version': '2022-11-28' },
            cache: 'no-store',
          }).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; })
        : Promise.resolve('');
      return viaApi.then(function (t2) {
        if (looksRight(t2)) return show(t2);
        // 3. Vercel
        if (VERCEL_URL) return showUrl(VERCEL_URL);
        fail();
      });
    });
})();
</script>
