 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/><\/svg><\/button>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n  <\!-- HERO -->\n  <div class=\"hero\">\n    <div class=\"wrap\">\n      <div>\n        <span class=\"label\"><b>01<\/b> / Webinar chat automation<\/span>\n        <h1 data-split>Run the webinar. <em class=\"it\">Not the chat.<\/em><\/h1>\n        <p class=\"lead\" data-reveal>Pick the sheet tab and the mode, and press launch. The agent posts every timed chat on cue, replies to attendees privately, and collects numbers while you watch it here.<\/p>\n        <div class=\"cta\" data-reveal>\n          <a class=\"btn acid\" href=\"#launch\">Launch the agent <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/a>\n          <a class=\"btn ghost\" href=\"#live\">See what's live<\/a>\n        <\/div>\n      <\/div>\n      <div class=\"orb-card\" id=\"orbCard\" data-state=\"idle\" data-reveal>\n        <span class=\"label\">Agent status<\/span>\n        <div class=\"orb\"><div class=\"ring\"><\/div><div class=\"ring r2\"><\/div><div class=\"ring r3\"><\/div><div class=\"sweep\"><\/div><div class=\"pulse\"><\/div><div class=\"pulse p2\"><\/div><div class=\"core\"><i><\/i><\/div><\/div>\n        <div class=\"orb-meta\">\n          <div class=\"state\" id=\"orbState\">Idle<\/div>\n          <div class=\"sub\" id=\"orbSub\">No webinar agent running right now<\/div>\n          <div class=\"clock\" id=\"orbClock\">--:--:--<\/div>\n        <\/div>\n        <div class=\"orb-actions\" id=\"orbActions\"><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"ribbon\" aria-label=\"Upcoming timed chats\"><div class=\"track\" id=\"ribbon\"><\/div><\/div>\n\n  <\!-- LAUNCH -->\n  <section id=\"launch\">\n    <div class=\"wrap\">\n      <div class=\"shead\">\n        <div><span class=\"label\"><b>02<\/b> / Launch sequence<\/span><h2 data-split>Pick the webinar. <em class=\"it\">Then hands off.<\/em><\/h2><\/div>\n        <p data-reveal>Choose the webinar, then the tab (or the day) it should read, so it only posts what you pick. Start it up to 45 minutes before the first chat. It waits, then joins 5 minutes early.<\/p>\n      <\/div>\n      <div class=\"launch\">\n        <div>\n          <div class=\"step active done\" id=\"step0\" data-reveal>\n            <div class=\"step-h\"><span class=\"step-n\">00<\/span><div><h3>Which webinar is it?<\/h3><p>Each webinar has its own sheet, join link and rules.<\/p><\/div><\/div>\n            <div class=\"seg\" id=\"webinarSeg\">\n              <button class=\"opt\" data-webinar=\"business\"><span class=\"tag\">7:30 PM<\/span><b>10 Min Business<\/b><span>FlexiGenie sales webinar. Timed chats, AI replies that go for the number, 1h 15m pricing lock. Joins via sb.flexifunnels.com/genie-demo.<\/span><\/button>\n              <button class=\"opt\" data-webinar=\"fifteen\"><span class=\"tag\">Buyers \u00b7 7 PM<\/span><b>15 Days First Sale Challenge<\/b><span>Buyers' session. Timed chats from the day's tab + replies that clear doubts. No number asks, no pricing lock. Joins via sb.flexifunnels.com/fifteendays.<\/span><\/button>\n            <\/div>\n          <\/div>\n          <div class=\"step active\" id=\"step1\" data-reveal>\n            <div class=\"step-h\"><span class=\"step-n\">01<\/span><div><h3 id=\"step1Title\">Which tab should it read?<\/h3><p id=\"step1Sub\">Only tabs with a \"Video Time\" header are shown.<\/p><\/div>\n              <button class=\"btn ghost sm right\" id=\"refreshTabs\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5\"/><\/svg>Refresh<\/button><\/div>\n            <div class=\"tabs-grid\" id=\"tabsGrid\"><div class=\"empty\">Loading tabs\u2026<\/div><\/div>\n          <\/div>\n          <div class=\"step\" id=\"step3\" data-reveal>\n            <div class=\"step-h\"><span class=\"step-n\">02<\/span><div><h3>How much should it do?<\/h3><p>Start with a dry run on your first live webinar.<\/p><\/div><\/div>\n            <div class=\"seg three\" id=\"modeSeg\">\n              <button class=\"opt\" data-mode=\"dry\"><span class=\"tag\">Safe<\/span><b>Dry run<\/b><span>Joins and reads everything, logs what it would send. Sends nothing.<\/span><\/button>\n              <button class=\"opt\" data-mode=\"timed\"><span class=\"tag\">Step 2<\/span><b>Timed chats<\/b><span>Posts the sheet's chats on cue and saves every number typed in chat. No private messages. Your team answers.<\/span><\/button>\n              <button class=\"opt risky\" data-mode=\"full\"><span class=\"tag\">Full auto<\/span><b>Everything<\/b><span>Timed chats, plus polite AI replies to genuine questions only, as \"our team\" and in the attendee's language. Every reply goes for the number.<\/span><\/button>\n            <\/div>\n            <div class=\"hint\" id=\"modeHint\"><\/div>\n          <\/div>\n          <div class=\"step\" id=\"step4\" data-reveal>\n            <div class=\"step-h\"><span class=\"step-n\">03<\/span><div><h3>Direct Zoom link <span class=\"opt-tag\">optional<\/span><\/h3><p id=\"directSub\">Paste a Zoom webinar link or ID to skip everything else. The agent joins that webinar right away as the main (host) account and stays until it ends.<\/p><\/div><\/div>\n            <div class=\"direct\">\n              <input id=\"directUrl\" type=\"text\" inputmode=\"url\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"https://us06web.zoom.us/j/81234567890?pwd=\u2026   or   812 3456 7890\">\n              <button class=\"btn ghost sm\" id=\"directClear\" type=\"button\">Clear<\/button>\n            <\/div>\n            <div class=\"hint\" id=\"directHint\"><\/div>\n            <div class=\"acct\"><span class=\"acct-l\">Zoom account for this run<\/span>\n              <div class=\"acct-seg\" id=\"acctSeg\">\n                <button type=\"button\" data-acct=\"auto\" class=\"on\">Auto<\/button>\n                <button type=\"button\" data-acct=\"marketing\">marketing@<\/button>\n                <button type=\"button\" data-acct=\"arman\">arman@<\/button>\n              <\/div>\n              <small id=\"acctHint\"><\/small><\/div>\n            <label class=\"testnow\"><input type=\"checkbox\" id=\"testNow\"><span class=\"box\"><\/span><span><b>Test: play the tab's chats from now<\/b><small>The tab's timed chats start about 2 minutes after launch instead of at their real times. The 1h 15m pricing lock moves with them. Use only for tests.<\/small><\/span><\/label>\n          <\/div>\n        <\/div>\n        <aside class=\"summary\" data-reveal>\n          <span class=\"label\">Flight plan<\/span>\n          <h3 id=\"sumTitle\">Choose a tab to begin<\/h3>\n          <div class=\"sum-row\"><span>Tab<\/span><b id=\"sumTab\">-<\/b><\/div>\n          <div class=\"sum-row\"><span>Timed chats<\/span><b id=\"sumCount\">-<\/b><\/div>\n          <div class=\"sum-row\"><span>First \u2192 last<\/span><b id=\"sumSpan\">-<\/b><\/div>\n          <div class=\"sum-row\"><span>Joins via<\/span><b id=\"sumJoin\" title=\"https://sb.flexifunnels.com/genie-demo\">sb.flexifunnels.com/genie-demo<\/b><\/div>\n          <div class=\"sum-row\"><span>Mode<\/span><b id=\"sumMode\">-<\/b><\/div>\n          <div class=\"sum-row\" title=\"Hard rule: no prices, EMI, offers or payment links before 1h15m into the session\"><span>Pricing unlocks<\/span><b id=\"sumPrice\">-<\/b><\/div>\n          <div class=\"window\"><span class=\"label\" id=\"winLabel\">Launch window<\/span><div class=\"wt\" id=\"winText\">-<\/div><div class=\"wbar\"><i id=\"winBar\"><\/i><\/div><\/div>\n          <button class=\"btn acid\" id=\"launchBtn\" disabled>Launch the agent <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button>\n          <div class=\"note\" id=\"launchNote\">Runs on GitHub Actions. You can stop it any time from here.<\/div>\n        <\/aside>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <\!-- LIVE -->\n  <div class=\"dark-band\" id=\"live\">\n    <div class=\"wrap\">\n      <div class=\"shead\">\n        <div><span class=\"label\"><b>03<\/b> / Live run<\/span><h2 data-split>Every chat, <em class=\"it\">right on cue.<\/em><\/h2><\/div>\n        <p data-reveal>Counts come from today's Agent Log tab and refresh every few seconds. The timeline shows the chosen tab against the clock.<\/p>\n      <\/div>\n      <div class=\"kpis\">\n        <div class=\"kpi\" data-reveal id=\"kTimed\"><span class=\"label\"><i style=\"background:var(--acid)\"><\/i>Timed chats sent<\/span><div class=\"v\" data-k=\"timed\">0<\/div><div class=\"s\" id=\"kTimedS\">of 0 in this tab<\/div><\/div>\n        <div class=\"kpi\" data-reveal id=\"kReply\"><span class=\"label\"><i style=\"background:var(--sky)\"><\/i>AI replies<\/span><div class=\"v\" data-k=\"reply\">0<\/div><div class=\"s\">sent privately<\/div><\/div>\n        <div class=\"kpi\" data-reveal id=\"kNumber\" style=\"border-color:rgba(184,166,246,.4);background:linear-gradient(160deg,rgba(184,166,246,.12),var(--panel))\"><span class=\"label\"><i style=\"background:var(--lilac)\"><\/i>Numbers captured \u00b7 top goal<\/span><div class=\"v\" data-k=\"number\">0<\/div><div class=\"s\" id=\"kNumberS\">of people who chatted<\/div><\/div>\n        <div class=\"kpi\" data-reveal id=\"kTeam\"><span class=\"label\"><i style=\"background:var(--amber)\"><\/i>Needs the team<\/span><div class=\"v\" data-k=\"team\">0<\/div><div class=\"s\">questions the agent left for you<\/div><\/div>\n      <\/div>\n      <div class=\"live-grid\">\n        <div class=\"card\" data-reveal>\n          <div class=\"card-h\"><h3>Run progress<\/h3><a class=\"btn ghost sm\" id=\"runLink\" href=\"#\" target=\"_blank\" rel=\"noopener\" hidden>Open on GitHub<\/a><\/div>\n          <div class=\"steps-track\" id=\"stepsTrack\"><div class=\"fill\" id=\"stepsFill\" style=\"height:0\"><\/div><div class=\"empty\">Launch the agent to see its progress here.<\/div><\/div>\n        <\/div>\n        <div class=\"card\" data-reveal>\n          <div class=\"card-h\"><h3>Timed chats<\/h3><span class=\"label\" id=\"tlTab\">-<\/span><\/div>\n          <div class=\"nextup\"><div class=\"row\"><span class=\"label\">Next chat in<\/span><span class=\"label\" id=\"nextType\"><\/span><\/div><div class=\"row\" style=\"margin-top:12px\"><div class=\"cd\" id=\"nextCd\">--:--<\/div><span class=\"label\" id=\"nextAt\"><\/span><\/div><div class=\"msg\" id=\"nextMsg\">Pick a tab to see the schedule.<\/div><\/div>\n          <div class=\"timeline\" id=\"timeline\"><div class=\"ends\"><span id=\"tlStart\"><\/span><span id=\"tlEnd\"><\/span><\/div><\/div>\n          <div class=\"legend\"><span><i style=\"background:var(--acid)\"><\/i>Sent / past<\/span><span><i style=\"background:var(--dim)\"><\/i>Upcoming<\/span><span><i style=\"background:var(--lilac)\"><\/i>Number drop<\/span><span><i style=\"background:var(--amber)\"><\/i>Price<\/span><span><i style=\"border-left:2px dashed var(--amber);border-radius:0;width:0;height:10px\"><\/i>Pricing unlocks (1h 15m)<\/span><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <\!-- FEED -->\n  <section id=\"feed\">\n    <div class=\"wrap\">\n      <div class=\"shead\">\n        <div><span class=\"label\"><b>04<\/b> / Conversations<\/span><h2 data-split>Every question. <em class=\"it\">Every answer.<\/em><\/h2><\/div>\n        <p data-reveal>Each attendee gets their own thread: what they typed on the left, the agent's private reply on the right. Timed chats and broadcasts sit in the pinned Everyone thread.<\/p>\n      <\/div>\n      <div class=\"chat\" data-reveal>\n        <aside class=\"convs\">\n          <div class=\"convs-h\">\n            <label class=\"search\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--dim)\" stroke-width=\"2.2\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-3.5-3.5\"/><\/svg><input id=\"convSearch\" placeholder=\"Search a name or message\" aria-label=\"Search conversations\"><\/label>\n            <div class=\"cfilters\" id=\"cfilters\"><button class=\"on\" data-cf=\"all\">All<b id=\"cfAll\"><\/b><\/button><button data-cf=\"replied\">Replied<b id=\"cfReplied\"><\/b><\/button><button data-cf=\"team\">Team<b id=\"cfTeam\"><\/b><\/button><button data-cf=\"number\">Numbers<b id=\"cfNumber\"><\/b><\/button><button data-cf=\"nonum\">No number<b id=\"cfNoNum\"><\/b><\/button><\/div>\n          <\/div>\n          <div class=\"conv-list\" id=\"convList\"><\/div>\n        <\/aside>\n        <div class=\"thread\">\n          <div class=\"thread-h\" id=\"threadHead\"><\/div>\n          <div class=\"msgs\" id=\"msgs\"><div class=\"chat-empty\"><b>No conversations yet<\/b>When attendees start typing in the webinar chat, their threads appear here.<\/div><\/div>\n          <div class=\"thread-f\"><span><i style=\"background:var(--panel2);border:1px solid var(--line2)\"><\/i>Attendee<\/span><span><i style=\"background:var(--acid)\"><\/i>Agent \u00b7 our team (private)<\/span><span><i style=\"border:1.5px dashed var(--acid)\"><\/i>Dry run, not sent<\/span><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"feed-grid\">\n        <div class=\"card\" data-reveal>\n          <div class=\"card-h\"><h3>Activity log <a class=\"btn ghost sm\" id=\"openSheet\" href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"margin-left:10px;vertical-align:4px\">Open sheet \u2197<\/a><button class=\"btn ghost sm danger\" id=\"clearChats\" style=\"margin-left:6px;vertical-align:4px\" title=\"Delete every chat and log row\">Clear chats<\/button><\/h3>\n            <div class=\"filters\" id=\"filters\"><span class=\"glider\"><\/span>\n              <button class=\"on\" data-f=\"all\">All<\/button><button data-f=\"timed\">Timed<\/button><button data-f=\"reply\">Replies<\/button><button data-f=\"number\">Numbers<\/button><button data-f=\"ask\">Asks<\/button><button data-f=\"team\">Team<\/button><button data-f=\"fail\">Failed<\/button>\n            <\/div>\n          <\/div>\n          <div class=\"feed\" id=\"feedList\"><div class=\"empty\">No activity today yet.<\/div><\/div>\n        <\/div>\n        <div>\n          <div class=\"card\" data-reveal style=\"margin-bottom:16px\">\n            <div class=\"card-h\"><h3>Numbers today<\/h3><div style=\"display:flex;gap:8px\"><button class=\"btn ghost sm\" id=\"soundBtn\" type=\"button\"><\/button><button class=\"btn ghost sm\" id=\"copyNumbers\">Copy all<\/button><button class=\"btn ghost sm danger\" id=\"clearNumbers\" title=\"Delete all saved numbers\">Clear<\/button><\/div><\/div>\n            <div class=\"fmt-hint\">Copies as: Name - Number<\/div>\n            <div class=\"side-list\" id=\"numbersList\"><div class=\"empty\">No numbers yet.<\/div><\/div>\n          <\/div>\n          <div class=\"card\" data-reveal>\n            <div class=\"card-h\"><h3>Needs the team<\/h3><span class=\"label\" id=\"teamCount\">0<\/span><\/div>\n            <div class=\"side-list\" id=\"teamList\"><div class=\"empty\">Nothing waiting on you.<\/div><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <\!-- AUTOMATIONS -->\n  <section id=\"automations\">\n    <div class=\"wrap\">\n      <div class=\"shead\">\n        <div><span class=\"label\"><b>05<\/b> / All automations<\/span><h2 data-split>One switchboard <em class=\"it\">for everything.<\/em><\/h2><\/div>\n        <p data-reveal>Every GitHub Actions workflow in the repo, with its last result. Workflows with no inputs start with one click. The webinar agent starts from the launch sequence above.<\/p>\n      <\/div>\n      <div class=\"wf-grid\" id=\"wfGrid\"><div class=\"empty\">Connect GitHub to load workflows.<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <\!-- HISTORY -->\n  <section id=\"history\">\n    <div class=\"wrap\">\n      <div class=\"shead\">\n        <div><span class=\"label\"><b>06<\/b> / Webinar history<\/span><h2 data-split>Every webinar, <em class=\"it\">in numbers.<\/em><\/h2><\/div>\n        <p data-reveal>Attendees, live leads and engagement for each webinar, plus the questions people asked and the replies they got. Saved to your Webinar History sheet when each webinar ends.<\/p>\n      <\/div>\n      <div class=\"hist\" data-reveal>\n        <aside class=\"hist-list\"><div class=\"hist-list-h\"><span class=\"label\">Webinars<\/span><button class=\"btn ghost sm danger\" id=\"clearHistory\" title=\"Delete every webinar from history\">Clear all<\/button><a class=\"btn ghost sm\" id=\"openHistSheet\" href=\"#\" target=\"_blank\" rel=\"noopener\" hidden>Open sheet \u2197<\/a><\/div><div id=\"histList\"><div class=\"empty\">No webinars recorded yet.<\/div><\/div><\/aside>\n        <div class=\"hist-detail\">\n          <div class=\"hist-head\" id=\"histHead\"><\/div>\n          <div class=\"hkpis\" id=\"histKpis\"><\/div>\n          <div class=\"qa-tools\">\n            <span class=\"label\" style=\"margin-right:auto\">Questions &amp; replies \u00b7 <b id=\"qaCount\">0<\/b><\/span>\n            <label class=\"search qa-search\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--dim)\" stroke-width=\"2.2\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-3.5-3.5\"/><\/svg><input id=\"qaSearch\" placeholder=\"Search questions and replies\" aria-label=\"Search questions and replies\"><\/label>\n            <button class=\"btn ghost sm\" id=\"qaCopy\">Copy<\/button>\n          <\/div>\n          <div class=\"qa\" id=\"qaTable\"><div class=\"empty\">Pick a webinar on the left.<\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n<\/main>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"big\">Let the chat<br><em class=\"it\">run itself.<\/em><\/div>\n    <div class=\"row\"><span>Webinar Autopilot \u00b7 FlexiFunnels internal tool<\/span><span id=\"footClock\"><\/span><\/div>\n  <\/div>\n<\/footer>\n\n<\!-- SETTINGS DRAWER -->\n<div class=\"scrim\" id=\"scrim\"><\/div>\n<aside class=\"drawer\" id=\"drawer\" aria-label=\"Settings\">\n  <div class=\"drawer-h\"><h3>Connect<\/h3><button class=\"icon-btn\" id=\"closeDrawer\" aria-label=\"Close settings\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M18 6 6 18M6 6l12 12\"/><\/svg><\/button><\/div>\n  <div class=\"drawer-b\">\n    <div class=\"fgroup\"><span class=\"label\"><b>A<\/b> / GitHub<\/span>\n      <div class=\"two\"><div class=\"field\"><label for=\"cOwner\">Owner<\/label><input id=\"cOwner\" placeholder=\"your-github-username\"><\/div><div class=\"field\"><label for=\"cRepo\">Repo<\/label><input id=\"cRepo\" placeholder=\"webinar-agent\"><\/div><\/div>\n      <div class=\"field\"><label for=\"cToken\">Personal GitHub token <span>(optional \u2013 leave empty when the Apps Script holds GITHUB_TOKEN)<\/span><\/label><input id=\"cToken\" type=\"password\" placeholder=\"github_pat_\u2026\" autocomplete=\"off\"><\/div>\n      <div class=\"field\"><label for=\"cWorkflow\">Agent workflow file<\/label><input id=\"cWorkflow\" placeholder=\"webinar-agent.yml\"><\/div>\n      <p class=\"small\">Token permissions: <code>Actions: Read and write<\/code> and <code>Contents: Read<\/code>. It's saved only in this browser, so use this page on your own computer.<\/p>\n    <\/div>\n    <div class=\"fgroup\"><span class=\"label\"><b>B<\/b> / Google Sheet feed<\/span>\n      <div class=\"field\"><label for=\"cScript\">Apps Script web-app URL<\/label><input id=\"cScript\" placeholder=\"https://script.google.com/macros/s/\u2026/exec\"><\/div>\n      <div class=\"field\"><label for=\"cKey\">Team password <span>(the KEY in the Apps Script)<\/span><\/label><input id=\"cKey\" type=\"password\" autocomplete=\"off\"><\/div>\n      <div class=\"field\"><label for=\"cScript15\">15 Days Apps Script URL <span>(from the 15 Days Challenge Chats sheet)<\/span><\/label><input id=\"cScript15\" placeholder=\"https://script.google.com/macros/s/\u2026/exec\"><\/div>\n      <div class=\"field\"><label for=\"cSheetUrl\">Chat sheet link <span>(for \"open sheet\" buttons)<\/span><\/label><input id=\"cSheetUrl\" placeholder=\"https://docs.google.com/spreadsheets/d/\u2026\"><\/div>\n      <div class=\"field\"><label for=\"cHistoryUrl\">Webinar History sheet link <span>(optional, for its \"open sheet\" button)<\/span><\/label><input id=\"cHistoryUrl\" placeholder=\"https://docs.google.com/spreadsheets/d/\u2026\"><\/div>\n      <p class=\"small\">Open the chat sheet \u2192 Extensions \u2192 Apps Script. Paste the code below and set <code>KEY<\/code> (the team password). In Project Settings \u2192 Script properties, add <code>GITHUB_TOKEN<\/code>. Then Deploy \u2192 New deployment \u2192 Web app (Execute as: Me \u00b7 Who has access: Anyone) and copy the URL here.<\/p>\n      <div class=\"field\" style=\"margin-top:12px\"><label>Apps Script code <button class=\"btn ghost sm\" id=\"copyScript\" style=\"margin-left:8px\">Copy<\/button><\/label><textarea id=\"scriptCode\" readonly><\/textarea><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"drawer-f\">\n    <label class=\"toggle\" title=\"Turn on only to preview with sample data\"><input type=\"checkbox\" id=\"cDemo\"><span class=\"sw\"><\/span>Use demo data<\/label>\n    <button class=\"btn ghost danger\" id=\"clearAll\" title=\"Delete all chats, numbers and webinar history\">Clear all data<\/button>\n    <button class=\"btn ghost\" id=\"signOut\" title=\"Forget the team password and token on this browser\">Sign out<\/button>\n    <button class=\"btn ghost\" id=\"testConn\">Test connection<\/button>\n    <button class=\"btn acid\" id=\"saveCfg\">Save<\/button>\n  <\/div>\n<\/aside>\n\n<div class=\"lock\" id=\"lock\" hidden>\n  <div class=\"lock-box\">\n    <span class=\"brand\"><span class=\"mark\"><i><\/i><\/span><span>Webinar Autopilot<small>FlexiFunnels \u00b7 team access<\/small><\/span><\/span>\n    <h3>Enter the team password<\/h3>\n    <p>Ask whoever set up the dashboard. You only need it once on this browser.<\/p>\n    <form id=\"lockForm\"><input id=\"lockKey\" type=\"password\" placeholder=\"Team password\" autocomplete=\"current-password\" aria-label=\"Team password\"><button class=\"btn acid\" type=\"submit\">Unlock<\/button><\/form>\n    <div class=\"lock-err\" id=\"lockErr\"><\/div>\n    <button class=\"lock-demo\" id=\"lockDemo\" type=\"button\">Just look around with demo data<\/button>\n  <\/div>\n<\/div>\n<div class=\"modal\" id=\"modal\"><div class=\"box\"><h3 id=\"mTitle\"><\/h3><p id=\"mText\"><\/p><div class=\"acts\"><button class=\"btn ghost\" id=\"mNo\">Cancel<\/button><button class=\"btn acid\" id=\"mYes\">Confirm<\/button><\/div><\/div><\/div>\n<div class=\"blast\" id=\"blast\"><div class=\"rings\"><i><\/i><i><\/i><i><\/i><i><\/i><\/div><div class=\"count\" id=\"blastCount\"><\/div><div class=\"done\" id=\"blastDone\"><div class=\"ck\"><svg width=\"54\" height=\"54\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0C0E13\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg><\/div><h3 id=\"blastTitle\">Agent dispatched<\/h3><p id=\"blastText\"><\/p><\/div><\/div>\n<div class=\"toasts\" id=\"toasts\"><\/div>\n\n<script>\n(() => {\n'use strict';\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\nconst esc = (s) => String(s ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst sleep = (ms) => new Promise((r) => setTimeout(r, ms));\nconst TZ = 'Asia/Kolkata';\nconst fmtTime = (d) => d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: TZ });\nconst fmtFull = (d) => d.toLocaleTimeString('en-IN', { hour12: true, timeZone: TZ });\nconst todayStr = () => new Date().toLocaleDateString('en-IN', { timeZone: TZ });\nconst LAUNCH_WINDOW_MIN = 45;\n\n// ---------- storage (wrapped: storage can throw) ----------\nconst store = {\n  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },\n  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },\n};\nconst DEFAULT_CFG = { owner: 'Sarthak-B', repo: 'webinar-chat-automation', token: '', workflow: 'webinar-agent.yml',\n  // Shared backend (protected by the team password \u2013 the URL alone gives no access)\n  script: 'https://script.google.com/macros/s/AKfycbxTem-HRvv5rgihalWUA35SCYDe9q4AVGp-cZbibWqPNxdooE0uTxeOb4YgBLVS-FcQ/exec', key: '',\n  script15: '', // 15 Days Challenge Chats sheet's Apps Script (\u2026/exec)\n  sheetUrl15: 'https://docs.google.com/spreadsheets/d/1T4UCbX34Yyxw14VFcN1xsTMlMnH-ffR0f21BgYegZ5w/edit',\n  sheetUrl: 'https://docs.google.com/spreadsheets/d/1sx70CnDmaDxci5xJ81UiAuZ1ZgoVLAKgOAX_cJOa4l8/edit', historyUrl: 'https://docs.google.com/spreadsheets/d/1mm1gDGITxgqOHHKr_sz_kGRA0_skORh6StMTG_wNrno/edit', demo: null };\n// Shared defaults (Apps Script URL, sheet links) are written by the FlexiFunnels loader, so teammates only need the team password.\nconst noBlanks = (o) => Object.fromEntries(Object.entries(o || {}).filter(([, v]) => v !== '' && v != null)); // an empty field never wipes a built-in default\nlet cfg = { ...DEFAULT_CFG, ...noBlanks(store.get('autopilot.defaults', {})), ...noBlanks(store.get('autopilot.cfg', {})) };\nconst configured = () => cfg.owner && cfg.repo && cfg.script && cfg.key; // GitHub token optional: the Apps Script holds it\nconst isDemo = () => (cfg.demo === null ? !configured() : cfg.demo);\n\nconst WEBINARS = {\n  business: { name: '10 Min Business', join: 'https://sb.flexifunnels.com/genie-demo' },\n  fifteen: { name: '15 Days First Sale Challenge', join: 'https://sb.flexifunnels.com/fifteendays' },\n};\nconst S = { webinar: (() => { try { return JSON.parse(localStorage.getItem('autopilot.webinar')) === 'fifteen' ? 'fifteen' : 'business'; } catch { return 'business'; } })(), conv: null, cfilter: 'all', csearch: '', tabs: [], tab: null, mode: 'dry', schedule: [], runs: [], active: null, jobs: null, log: [], logTotal: 0, numbers: [], numTotal: 0, workflows: [], wfRuns: {}, filter: 'all', armed: null, defaultBranch: 'main' };\n\n// ---------- clock (parse \"10:45:00 am\" for today, same as the agent) ----------\nfunction parseClock(str, base = new Date()) {\n  const m = String(str || '').trim().match(/^(\\d{1,2}):(\\d{2})(?::(\\d{2}))?\\s*([ap]\\.?m\\.?)?$/i);\n  if (!m) return null;\n  let h = +m[1]; const ap = (m[4] || '').toLowerCase().replace(/\\./g, '');\n  if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0;\n  const d = new Date(base); d.setHours(h, +m[2], +(m[3] || 0), 0); return d;\n}\nfunction toSchedule(rows) {\n  const out = []; let prev = null;\n  rows.forEach((r, i) => {\n    let at = parseClock(r[1]); if (!at || !String(r[2] || '').trim()) return;\n    if (prev && at < prev - 3600e3) at = new Date(at.getTime() + 864e5);\n    prev = at; out.push({ video: r[0], host: r[1], at, text: String(r[2]).trim(), type: String(r[3] || '').trim(), i });\n  });\n  return out.sort((a, b) => a.at - b.at);\n}\n\n// ---------- APIs ----------\nasync function gh(path, opts = {}) {\n  if (!cfg.token) {\n    // Through the Apps Script: it holds the GitHub token (Script properties \u2192 GITHUB_TOKEN)\n    const r = await feed({ action: 'gh', method: opts.method || 'GET', path, body: opts.body || '' });\n    if (r.status >= 300) throw new Error(`GitHub: ${(r.data && r.data.message) || r.status}`);\n    return r.status === 204 || r.status === 202 ? null : r.data;\n  }\n  const res = await fetch(`https://api.github.com${path}`, {\n    ...opts,\n    headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${cfg.token}`, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },\n  });\n  if (!res.ok && res.status !== 204 && res.status !== 202) {\n    let msg = res.status + ''; try { msg = (await res.json()).message || msg; } catch {}\n    throw new Error(`GitHub: ${msg}`);\n  }\n  return res.status === 204 || res.status === 202 ? null : res.json();\n}\nconst repo = () => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;\nasync function feed(params) {\n  // 15 Days day tabs come from the 15 Days sheet's own Apps Script (same team password)\n  const fifteen = params.book === 'fifteen';\n  if (fifteen && cfg.script15) { params = { ...params }; delete params.book; }\n  const u = new URL(fifteen && cfg.script15 ? cfg.script15 : cfg.script); u.searchParams.set('key', cfg.key);\n  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));\n  const res = await fetch(u.toString());\n  const data = await res.json();\n  if (data.error) throw new Error(`Sheet: ${data.error}`);\n  return data;\n}\n\n// ---------- DEMO data (clearly marked, used until you connect) ----------\nconst Demo = (() => {\n  const tabs = [\n    { name: 'Variant 3 \u2013 11 AM', schedule: true, count: 160, first: '10:45:00 am', last: '3:18:32 pm' },\n    { name: 'Variant 4 \u2013 7:30 PM', schedule: true, count: 160, first: '7:15:00 pm', last: '11:48:32 pm' },\n    { name: 'Variant 2 \u2013 11 AM', schedule: true, count: 156, first: '10:45:00 am', last: '3:18:32 pm' },\n    { name: 'Variant 2 \u2013 7:30 PM', schedule: true, count: 155, first: '7:15:00 pm', last: '11:48:32 pm' },\n    { name: 'FlexiGenie Chats', schedule: true, count: 153, first: '10:45:00 am', last: '3:18:34 pm' },\n    { name: 'FlexiGenie Chats 7:30 PM', schedule: true, count: 153, first: '7:15:00 pm', last: '11:48:34 pm' },\n  ];\n  const lines = [\n    ['Hype', 'Welcome! We start in 15 minutes \u2013 get ready to see a complete online business built LIVE with AI'],\n    ['Engagement', 'Hi everyone'], ['Engagement', 'Where are you attending from?'],\n    ['Hook', 'Launch your entire online business in 10 minutes \u2013 just by chatting from your mobile'],\n    ['Proof', '\u20b9550 Crore+ of real transaction data'], ['Engagement', 'Type T for True, F for False'],\n    ['Engagement', 'Q1: You must have your own product to make money online. Type T or F'],\n    ['Proof', '\u20b98,435 >> \u20b912 Lakh | \u20b94,834 >> \u20b919 Lakh'], ['Engagement', 'Demo starting \u2013 watch closely'],\n    ['Proof', 'Live in just 2 minutes'], ['NUMBER DROP', 'For doubts and queries, share your contact number.'],\n    ['Pitch', 'Zero risk \u2013 30 days 100% money back guarantee'], ['Price', 'EMI \u2013 Rs. 59/day Enrol Here \u2013 https://sb.flexifunnels.com/get?id=19029'],\n    ['NUMBER DROP', 'Please share your contact number. Our team will guide you'], ['Scarcity', 'Last Call \ud83d\udce2'],\n    ['Engagement', 'Congratulations to all action takers. Welcome to FlexiFunnels.'],\n  ];\n  // a \"live\" demo session that started 25 minutes ago\n  const start = Date.now() - 25 * 60e3;\n  const rows = Array.from({ length: 160 }, (_, i) => {\n    const [type, text] = lines[i % lines.length];\n    const at = new Date(start + i * 1.7 * 60e3 - 15 * 60e3);\n    return ['', at.toLocaleTimeString('en-US', { hour12: true }).toLowerCase(), text, type];\n  });\n  const people = ['Rahul Sharma', 'Priya Verma', 'Ankit', 'Sneha K', 'Vikram Singh', 'Pooja', 'Imran Khan', 'Neha Gupta', 'Arjun', 'Kavya'];\n  const asks = [\n    ['REPLY', 'price kya hai?', 'Ji, aaj ka offer $447 hai (\u20b936,999 incl. GST) \u2013 link: https://sb.flexifunnels.com/get?id=19029. Kripya apna contact number share kijiye, humari team aapko guide karegi.'],\n    ['REPLY', 'Is EMI available?', 'Yes {n}, EMI starts at under \u20b91,800/month on the same link. Please share your contact number and our team will help you with the plan.'],\n    ['REPLY', 'recording milegi?', 'Ji {n}, humari team aapke number par recording bhejwa degi. Kripya apna WhatsApp number yahan share kijiye.'],\n    ['NUMBER', '98XXXXX421', '{n}, your number has been shared with our senior mentors. They will get in touch with you shortly.'],\n    ['REPLY', '\u0915\u094d\u092f\u093e \u0928\u094c\u0915\u0930\u0940 \u0915\u0947 \u0938\u093e\u0925 \u092f\u0947 \u0915\u0930 \u0938\u0915\u0924\u0947 \u0939\u0948\u0902?', '\u091c\u0940 \u0939\u093e\u0901 {n}, \u0930\u094b\u091c\u093c 60 \u092e\u093f\u0928\u091f \u0915\u093e\u092b\u093c\u0940 \u0939\u0948\u0902 \u2013 \u0915\u0908 \u0932\u094b\u0917\u094b\u0902 \u0928\u0947 \u091c\u0949\u092c \u0915\u0947 \u0938\u093e\u0925 \u0939\u0940 \u0936\u0941\u0930\u0941\u0906\u0924 \u0915\u0940 \u0939\u0948\u0964 \u0915\u0943\u092a\u092f\u093e \u0905\u092a\u0928\u093e \u0928\u0902\u092c\u0930 \u0936\u0947\u092f\u0930 \u0915\u0930\u0947\u0902, \u0939\u092e\u093e\u0930\u0940 \u091f\u0940\u092e \u0906\u092a\u0915\u094b \u092a\u094d\u0932\u093e\u0928 \u0938\u092e\u091d\u093e \u0926\u0947\u0917\u0940\u0964'],\n    ['NEEDS TEAM', 'I paid yesterday but did not get login details', 'We\\'re sorry for the trouble, {n}. Our team will check your login right away \u2013 please share your contact number so they can call you.'],\n    ['NUMBER', '91XXXXX077', '\u0927\u0928\u094d\u092f\u0935\u093e\u0926 {n} \u091c\u0940\u0964 \u0939\u092e\u093e\u0930\u0940 \u091f\u0940\u092e \u091c\u0932\u094d\u0926 \u0939\u0940 \u0907\u0938 \u0928\u0902\u092c\u0930 \u092a\u0930 \u0906\u092a\u0938\u0947 \u0938\u0902\u092a\u0930\u094d\u0915 \u0915\u0930\u0947\u0917\u0940\u0964'],\n  ];\n  const trivial = ['Yes', 'YES \ud83d\udd25', '1', 'Mumbai', 'Delhi se', 'T', 'F', 'Excited!', 'Hi sir \ud83d\ude4f', '\ud83d\udd25\ud83d\udd25\ud83d\udd25', 'Jaipur', 'Type 1 \u2013 1'];\n  let k = 0, a = 0, pending = [];\n  const asked = new Set(), seenOnce = new Set(), numbered = new Set();\n  const bankLines = ['kripya apna contact number share kijiye \u2013 humari team aapko personal roadmap ke saath guide karegi.', 'if you would like a one-on-one plan, please share your contact number and our team will call you.', 'kisi bhi sawaal ke liye apna number share kijiye, humari team aapse sampark karegi.'];\n  const row = (kind, to, sent, said, note = '', at = new Date()) => [todayStr(), fmtFull(at), kind, to, sent, said, note];\n  // one \"tick\" of fake chat: someone types, and the agent answers on the next tick\n  function tick(at = new Date()) {\n    const out = pending.map((p) => (p[1] = fmtFull(at), p)); pending = [];\n    const p = people[k++ % people.length], first = p.split(' ')[0];\n    if (Math.random() < .4) {\n      out.push(row('IN', p, '', trivial[Math.floor(Math.random() * trivial.length)], '', at));\n      // engagement replies (\"Yes\", \"1\", \ud83d\udd25) get no reply\n      return out;\n    }\n    const [kind, said, reply] = asks[a++ % asks.length];\n    out.push(row('IN', p, '', said, '', at));\n    const said2 = kind === 'NUMBER' ? `9${(7 + (k % 3))}XXXXX${String(100 + ((k * 37) % 900))}` : said;\n    if (kind === 'NUMBER') out[out.length - 1][5] = said2;\n    if (kind === 'NEEDS TEAM') { pending.push(row('DRY NEEDS TEAM', p, '', said, 'account/login problem \u2013 needs a human', at)); pending.push(row('DRY NUMBER ASK', p, reply.replace('{n}', first), said, 'needs team \u00b7 english', at)); }\n    else {\n      let msg = reply.replace('{n}', first);\n      if (kind === 'NUMBER') numbered.add(p);\n      else if (numbered.has(p)) msg = msg.replace(/\\s*(Kripya|Please share|\u0915\u0943\u092a\u092f\u093e)[^]*$/, '').trim(); // already has their number \u2013 don't ask again\n      pending.push(row(`DRY ${kind}`, p, msg, said2, '', at));\n    }\n    return out;\n  }\n  const log = [];\n  return {\n    tabs, rows, log, tick, people,\n    seed() {\n      const now = Date. ssList.toggle('done', !!S.tab); $('#step3').classList.toggle('active', !!S.tab);\n  const hints = {\n    dry: 'Best for the first live test. Your team handles chat as usual, then compare the Agent Log with what they did.',\n    timed: 'Sir\\'s timed chats go out on cue and every number typed is saved. The agent sends no private messages, so your team answers questions.',\n    full: 'Only genuine questions get a reply. \"Type 1\" / \"Yes\" answers are left alone. Replies are short, professional and in the team\\'s voice (\"our team\", \"humari team\"), in Hindi, English or Hinglish to match the attendee, paced like a person typing. Each one goes for the number. Keep someone watching \"Needs the team\".',\n  };\n  if (isFifteen()) hints.full = 'Buyers\\' session: the day\\'s timed chats go out on cue and genuine doubts get a short, polite reply in the attendee\\'s language. No number asks, no selling, no pricing lock. Anything it can\\'t answer shows under \"Needs the team\".';\n  if (isFifteen()) hints.timed = 'Only the day\\'s timed chats go out. No private replies \u2013 your team answers doubts.';\n  $('#modeHint').innerHTML = `<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"${S.mode === 'full' ? 'var(--red)' : 'var(--acid)'}\" stroke-width=\"2.2\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 8v5M12 16h.01\"/><\/svg><span>${hints[S.mode]}<\/span>`;\n}\nconst modeName = { dry: 'Dry run', timed: 'Timed chats', full: 'Everything' };\n// Direct Zoom link: a zoom.us meeting/webinar link or a bare 9\u201312 digit ID\nfunction directValue() { return ($('#directUrl')?.value || '').trim(); }\nfunction directState() {\n  const v = directValue(); if (!v) return { on: false };\n  const bare = v.replace(/[\\s-]/g, '');\n  if (/^\\d{9,12}$/.test(bare)) return { on: true, ok: true, label: `Webinar ID ${bare.slice(0, 3)} ${bare.slice(3, 7)} ${bare.slice(7)}` };\n  if (/^https?:\\/\\/([\\w-]+\\.)?zoom\\.us\\/(j|w|s|wc)\\/\\d{9,12}/i.test(v)) ret );\n  const nl = $('#nowLine'); if (nl) { const p = Math.min(1, Math.max(0, (now - a) / Math.max(1, b - a))); nl.style.left = `calc(12px + (100% - 24px) * ${p})`; nl.style.opacity = now < a || now > b ? .35 : 1; }\n  const next = S.schedule.find((x) => x.at.getTime() > now);\n  if (next) {\n    $('#nextCd').textContent = countdown(next.at.getTime() - now); $('#nextAt').textContent = `at ${fmtFull(next.at)}`;\n    $('#nextType').textContent = next.type; $('#nextMsg').textContent = next.text;\n  } else { $('#nextCd').textContent = 'Done'; $('#nextAt').textContent = ''; $('#nextType').textContent = ''; $('#nextMsg').textContent = 'All timed chats in this tab are past.'; }\n}\nfunction renderRibbon() {\n  const now = Date.now();\n  let items = S.schedule.filter((x) => x.at.getTime() > now).slice(0, 10);\n  if (!items.length) items = S.schedule.slice(0, 10);\n  const html = items.length\n    ? items.map((x) => `<span class=\"it\"><b>${esc(fmtFull(x.at))}<\/b><u>${esc(x.type || 'chat')}<\/u>${esc(x.text.split('\\n')[0].slice(0, 90))}<\/span>`).join('')\n    : ['Pick a tab', 'Choose the Zoom link', 'Pick a mode', 'Launch', 'Watch the chat run itself'].map((t, i) => `<span class=\"it\"><b>0${i + 1}<\/b>${t}<\/span>`).join('');\n  $('#ribbon').innerHTML = html + html;\n}\n\n// ---------- runs ----------\nasync function loadRuns() {\n  try {\n    if (isDemo()) { S.runs = [Demo.run]; }\n    else {\n      const d = await gh(`${repo()}/actions/workflows/${encodeURIComponent(cfg.workflow)}/runs?per_page=15`);\n      S.runs = d.workflow_runs;\n    }\n    setPill('#pillGh', 'ok', 'GitHub connected');\n    S.active = S.runs.find((r) => ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(r.status)) || null;\n    if (S.active && !isDemo()) S.jobs = (await gh(`${repo()}/actions/runs/${S.active.id}/jobs`)).jobs;\n    else if (S.active) S.jobs = [{ steps: ['Set up job', 'Run actions/checkout@v4', 'Run actions/setup-node@v4', 'Run npm ci', 'Install Chromium', 'Restore Zoom session', 'Run agent', 'Save refreshed Zoom session', 'Wipe session file'].map((name, i) => ({ name, status: i < 6 ? 'completed' : i === 6 ? 'in_progress' : 'queued', conclusion: i < 6 ? 'success' : null, started_at: new Date(Date.now() - (30 - i * 2) * 60e3).toISOString() })) }];\n    else S.jobs = null;\n  } catch (e) { setPill('#pillGh', 'bad', e.message); }\n  renderOrb(); renderSteps(); renderHistory(); renderLaunch();\n}\nfunction runTitle(r) { return r.display_title || r.name || 'Run'; }\nfunction renderOrb() {\n  const card = $('#orbCard'), r = S.active;\n  let state = 'idle', title = 'Idle', sub = 'No webinar agent running right now';\n  if (S.armed) { state = 'armed'; title = 'Armed'; sub = `Auto-launches ${S.armed.tab} at ${fmtTime(new Date(S.armed.at))}`; }\n  // Show a run that just failed (last 30 min) instead of silently going back to Idle\n  const last = !r && S.runs[0];\n  const recentFail = last && last.status === 'completed' && ['failure', 'timed_out', 'startup_failure'].includes(last.conclusion) && Date.now() - new Date(last.updated_at) < 30 * 60e3;\n  if (recentFail) { state = 'failed'; title = 'Last run failed'; sub = `${runTitle(last).replace(/^Webinar agent \u00b7 /, '')} \u00b7 ${fmtTime(new Date(last.updated_at))} \u2013 open the run to see why`; }\n  if (r) {\n    state = r.status === 'in_progress' ? 'live' : 'queued';\n    title = r.status === 'in_progress' ? 'Live' : 'Starting\u2026';\n    sub = runTitle(r).replace(/^Webinar agent \u00b7 /, '');\n  }\n  if (isDemo()) sub = `${sub} \u00b7 demo \u2013 not a real run`;\n  card.dataset.state = state; $('#orbState').textContent = title; $('#orbSub').textContent = sub;\n  const acts = $('#orbActions');\n  if (r) acts.innerHTML = `<button class=\"btn danger sm\" id=\"stopBtn\">Stop agent<\/button>${r.html_url && r.html_url !== '#' ? `<a class=\"btn ghost sm\" href=\"${esc(r.html_url)}\" target=\"_blank\" rel=\"noopener\">Open run<\/a>` : ''}`;\n  else if (S.armed) acts.innerHTML = '<button class=\"btn ghost sm\" id=\"disarmBtn\">Disarm<\/button>';\n  else if (recentFail && last.html_url) acts.innerHTML = `<a class=\"btn danger sm\" href=\"${esc(last.html_url)}\" target=\"_blank\" rel=\"noopener\">Open failed run \u2197<\/a><a class=\"btn ghost sm\" href=\"#launch\">Launch again<\/a>`;\n  else acts.innerHTML = '<a class=\"btn ghost sm\" href=\"#launch\">Go to launch<\/a>';\n  $('#stopBtn')?.addEventListener('click', stopRun); $('#disarmBtn')?.addEventListener('click', disarm);\n}\nfunction renderSteps() {\n  const track = $('#stepsTrack'), link = $('#runLink');\n  const steps = S.jobs?.[0]?.steps || [];\n  if (!S.active || !steps.length) {\n    track.innerHTML = `<div class=\"fill\" id=\"stepsFill\" style=\"height:0\"><\/div><div class=\"empty\">${S.active ? 'Waiting for a GitHub runner\u2026' : 'Launch the agent to see its progress here.'}<\/div>`;\n    link.hidden = true; return;\n  }\n  link.hidden = !S.active.html_url || S.active.html_url === '#'; link.href = S.active.html_url;\n  const nice = (n) => n.replace(/^Run /, '').replace('actions/checkout@v4', 'Get the code').replace('actions/setup-node@v4', 'Set up Node').replace('npm ci', 'Install packages').replace(/^agent$/, 'Agent in the webinar');\n  track.innerHTML = '<div class=\"fill\" id=\"stepsFill\"><\/div>' + steps.filter((s) => !/^Post |Complete job/.test(s.name)).map((s) => {\n    const cls = s.status === 'completed' ? (s.conclusion === 'success' || s.conclusion === 'skipped' ? 'done' : 'fail') : s.status === 'in_progress' ? 'run' : '';\n    return `<div class=\"st ${cls}\"><span>${esc(nice(s.name))}<\/span><time>${s.started_at && cls ? fmtTime(new Date(s.started_at)) : ''}<\/time><\/div>`;\n  }).join('');\n  requestAnimationFrame(() => {\n    const all = $$('.st', track), last = all.filter((x) => x.classList.contains('done') || x.classList.contains('run')).at(-1);\n    $('#stepsFill').style.height = last ? `${last.offsetTop + 14}px` : '0';\n  });\n}\nfunction renderHistory() {\n  const body = $('#historyBody');\n  if (!body) return;\n  if (!S.runs.length) { body.innerHTML = '<tr><td colspan=\"5\" class=\"empty\">No runs yet.<\/td><\/tr>'; return; }\n  body.innerHTML = S.runs.map((r) => {\n    const st = r.status === 'completed' ? r.conclusion : r.status;\n    const start = new Date(r.run_started_at || r.created_at), end = r.status === 'completed' ? new Date(r.updated_at) : new Date();\n    const mins = Math.round((end - start) / 60e3);\n    return `<tr><td><span class=\"mono\">${start.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: TZ })} \u00b7 ${fmtTime(start)}<\/span><\/td><td>${esc(runTitle(r).replace(/^Webinar agent \u00b7 /, ''))}<\/td><td><span class=\"status ${esc(st)}\"><i><\/i>${esc(String(st).replace('_', ' '))}<\/span><\/td><td><span class=\"mono\">${mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`}<\/span><\/td><td>${r.html_url && r.html_url !== '#' ? `<a href=\"${esc(r.html_url)}\" target=\"_blank\" rel=\"noopener\">View \u2192<\/a>` : ''}<\/td><\/tr>`;\n  }).join('');\n}\n\n// ---------- webinar history (from the Webinar History sheet) ----------\nconst H = { list: [], sel: null, qa: [], q: '', loadedFor: null };\nconst toObjs = (header, rows) => rows.map((r) => Object.fromEntries(header.map((h, i) => [h, r[i] ?? ''])));\nconst pctNum = (v) => parseFloat(String(v).replace('%', '')) || 0;\n\nconst DemoHistory = (() => {\n  const d = (daysAgo, h, m) => { const x = new Date(); x.setDate(x.getDate() - daysAgo); x.setHours(h, m, 0, 0); return x; };\n  const mk = (x, tab, att, leads, chat, q, r) => normaliseWebinar({\n    'Webinar ID': `${x.toLocaleString('sv-SE', { timeZone: TZ }).slice(0, 16)} \u00b7 ${tab}`, Date: x.toLocaleDateString('en-IN', { timeZone: TZ }), Webinar: tab,\n    Started: fmtTime(x), Ended: fmtTime(new Date(x.getTime() + 4.6 * 3600e3)), Attendees: att, 'Live leads': leads, 'People who chatted': chat, 'Questions asked': q, 'Replies given': r,\n  });\n  const list = [\n    mk(d(3, eet').href = cfg.historyUrl || '#';\n  if (!H.list.length) { $('#histList').innerHTML = '<div class=\"empty\" style=\"padding:30px 18px\">No webinars recorded yet. Each webinar is added here when it ends.<\/div>'; return; }\n  $('#histList').innerHTML = H.list.map((w) => `<button class=\"wcard ${w['Webinar ID'] === H.sel ? 'on' : ''}\" data-wid=\"${esc(w['Webinar ID'])}\">\n    <span class=\"wd\"><span>${esc(w.Date)} \u00b7 ${esc(w.Started)}<\/span><\/span>\n    <span class=\"wt\">${esc(w.Webinar)}<\/span>\n    <span class=\"ws\"><span><b>${esc(w.Attendees || '\u2013')}<\/b> attended<\/span><span><b class=\"lead\">${esc(w['Live leads'] || 0)}<\/b> leads<\/span><span><b class=\"lead\">${esc(w['Live lead %'] || '\u2013')}<\/b><\/span><\/span>\n  <\/button>`).join('');\n}\nfunction renderHistDetail() {\n  const w = H.list.find((x) => x['Webinar ID'] === H.sel);\n  if (!w) { $('#histHead').innerHTML = ''; $('#histKpis').innerHTML = ''; $('#qaTable').innerHTML = '<div class=\"empty\">Pick a webinar on the left.<\/div>'; $('#qaCount').textContent = 0; return; }\n  $('#histHead').innerHTML = `<div><span class=\"label\">${esc(w.Date)} \u00b7 ${esc(w.Started)}${w.Ended ? ` \u2192 ${esc(w.Ended)}` : ''}<\/span><h3>${esc(w.Webinar)}<\/h3><\/div><button class=\"btn ghost sm danger hist-del\" id=\"delWebinar\">Delete this webinar<\/button>`;\n  $('#delWebinar').onclick = () => deleteWebinar(w);\n  const tile = (label, v, sub, bar, cls = '') => `<div class=\"hk ${cls}\"><span class=\"label\">${label}<\/span><div class=\"v\">${esc(v)}<\/div><div class=\"s\">${sub}<\/div>${bar != null ? `<span class=\"bar\" style=\"width:${Math.min(100, bar)}%\"><\/span>` : ''}<\/div>`;\n  $('#histKpis').innerHTML = [\n    tile('Attendees', w.Attendees || '\u2013', w.Attendees ? 'present in the webinar' : 'not read from Zoom \u2013 type it in the sheet'),\n    tile('Live leads', w['Live leads'] || 0, w['Lead ratio'] ? `${esc(w['Lead ratio'])} attendees gave a number` : 'numbers captured', null, 'lead'),\n    tile('Live lead %', w['Live lead %'] || '\u2013', 'live leads \u00f7 attendees', pctNum(w['Live lead %']) * 4, 'lead'),\n    tile('Engagement %', w['Engagement %'] || '\u2013', `${esc(w['People who chatted'] || 0)} people chatted`, pctNum(w['Engagement %'])),\n  ].join('');\n  const q = H.q;\n  const rows = H.qa.filter((r) => !q || [r.Question, r.Reply].some((x) => String(x).toLowerCase().includes(q)));\n  $('#qaCount').textContent = H.qa.length;\n  $('#qaTable').innerHTML = `<div class=\"qa-row h\"><span>Time<\/span><span>Question<\/span><span>Reply<\/span><\/div>` + (rows.length ? rows.map((r) => `<div class=\"qa-row\">\n    <time>${esc(shortTime(r.Time))}<\/time><div class=\"q\">${esc(r.Question)}<\/div><div class=\"r ${r.Reply ? '' : 'none'}\">${r.Reply ? linkify(r.Reply) : 'No reply'}<\/div><\/div>`).join('')\n    : `<div class=\"empty\">${H.qa.length ? 'No questions match.' : 'No questions were asked in this webinar.'}<\/div>`);\n}\n\n// ---------- clean-up: delete chats / numbers / history (permanent, always confirmed) ----------\nconst CLEAR_TEXT = {\n  chats: ['Clear all chats?', 'Deletes every row in the Agent Log: conversations, replies, timed chats and the activity log, for every day. Numbers and webinar history stay. This cannot be undone.'],\n  numbers: ['Clear all numbers?', 'Deletes every saved number (the Numbers tab) and the attendee messages that contain a number. Other chats stay. This cannot be undone.'],\n  history: ['Clear all webinar history?', 'Deletes every webinar and its questions & replies from the Webinar History sheet. This cannot be undone.'],\n  all: ['Clear ALL data?', 'Deletes all chats, all numbers and all webinar history. The timed-chat tabs and settings are not touched. This cannot be undone.'],\n};\nasync function clearData(what) {\n  const [title, text] = CLEAR_TEXT[what];\n  if (!(await confirmBox(title, text, 'Delete'))) return;\n  try {\n    if (isDemo()) {\n      if (what === 'chats' || what === 'all') Demo.log.    $('#mTitle').textContent = title; $('#mText').textContent = text; $('#mYes').textContent = yes;\n    const m = $('#modal'); m.classList.add('on'); $('#scrim').classList.add('on');\n    const done = (v) => { m.classList.remove('on'); if (!$('#drawer').classList.contains('on')) $('#scrim').classList.remove('on'); resolve(v); };\n    $('#mYes').onclick = () => done(true); $('#mNo').onclick = () => done(false);\n  });\n}\nasync function onLaunchClick(e) {\n  if (S.armed) return disarm();\n  const w = launchWindow(); if (!S.tab || !w) return;\n  const d = directState();\n  if (d.on && !d.ok) return toast(d.msg, true);\n  const testNow = $('#testNow').checked;\n  if (!d.on && !testNow && Date.now() < w.opens) return arm(w.opens);\n  const ok = await confirmBox(`Launch ${WEBINARS[S.webinar].name} \u00b7 \"${S.tab.name}\"?`, `${modeName[S.mode]} \u00b7 joins via ${d.on ? d.label.toLowerCase() + ' as the host, right away' : joinLabel()} \u00b7 Zoom: ${acctUsed()}@ \u00b7 ${S.schedule.length} timed chats${testNow ? ' starting ~2 min from now (TEST)' : ''}.${S.mode === 'full' ? ' The agent will reply to attendees on its own.' : ''}`, 'Launch');\n  if (ok) launch(e);\n}\nasync function launch(e) {\n  const blast = $('#blast'), r = $('#launchBtn').getBoundingClientRect();\n  blast.style.setProperty('--bx', `${(e?.clientX ?? r.left + r.width / 2)}px`); blast.style.setProperty('--by', `${(e?.clientY ?? r.top + r.height / 2)}px`);\n  $('#blastDone').className = 'done'; blast.classList.add('on', 'go');\n  const dispatch = (async () => {\n    if (isDemo()) { await sleep(800); return; }\n    await gh(`${repo()}/actions/workflows/${encodeURIComponent(cfg.workflow)}/dispatches`, { method: 'POST', body: JSON.stringify({ ref: S.defaultBranch, inputs: { webinar: S.webinar, tab: S.tab.name, mode: S.mode, ...(directState().ok ? { direct_url: directValue() } : {}), ...($('#testNow').checked ? { test_from_now: 'true' } : {}), zoom_account: S.acct } }) });\n  })();\n  for (const n of ['3', ' onv !== c.name; lastConv = c.name;\n  const sent = c.ev.filter((e) => e.side === 'out').length, got = c.ev.filter((e) => e.side === 'in').length;\n  head.innerHTML = `<span class=\"av ${c.broadcast ? 'bc' : ''}\" ${c.broadcast ? '' : `style=\"${avatarStyle(c.name)}\"`}>${c.broadcast ? '<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M3 11l18-8-8 18-2-8-8-2z\"/><\/svg>' : esc(initials(c.name))}<\/span>\n    <div><div class=\"tn\">${c.broadcast ? 'Everyone' : esc(c.name)}<\/div><div class=\"ts\">${c.broadcast ? `${sent} timed chats & broadcasts to all attendees` : `${got} message${got === 1 ? '' : 's'} from them \u00b7 ${sent} repl${sent === 1 ? 'y' : 'ies'} from the agent`}<\/div><\/div>\n    <div class=\"tr\">${c.number ? `<span class=\"numchip\">${esc(c.number)}<button data-copy=\"${esc(contact(c.name, c.number))}\" aria-label=\"Copy name and number\" title=\"Copy as Name - Number\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M5 15V5a2 2 0 0 1 2-2h10\"/><\/svg><\/button><\/span>` : ''}\n    ${!c.broadcast && !c.number ? `<span class=\"tstat nonum\" title=\"${c.asked ? `Asked ${c.asked}\u00d7 so far` : 'Not asked yet'}\">No number yet${c.asked ? ` \u00b7 asked ${c.asked}\u00d7` : ''}<\/span>` : ''}\n    ${c.team ? '<span class=\"tstat team\">Needs team<\/span>' : c.replied ? '<span class=\"tstat ok\">Answered<\/span>' : ''}<\/div>`;\n\n  const prev = changed ? c.ev.length : (convSeen[c.name] ?? c.ev.length);\n  convSeen[c.name] = c.ev.length;\n  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;\n  let html = '<div class=\"daysep\">Today<\/div>';\n  c.ev.forEach((e, i) => {\n    const isNew = i >= prev ? 'new' : '';\n    if (e.side === 'sys') { html += `<div class=\"sys ${e.cls || ''} ${isNew}\">${esc(e.text)} \u00b7 ${esc(shortTime(e.time))}<\/div>`; return; }\n    const cont = i > 0 && c.ev[i - 1].side === e.side ? 'cont' : '';\n    html += `<div class=\"bw ${e.side} ${e.dry ? 'dry' : ''} ${cont} ${isNew}\"><div class=\"bubble\">${e.tag ? `<span class=\"tagl\">${esc(e.tag)}<\/span>` : ''}${linkify(e.text)}<\/div>\n      <div class=\"meta\">${esc(shortTime(e.time))}${e.side === 'out' ? (e.dry ? ' \u00b7 dry run, not sent' : ` \u00b7 ${c.broadcast ? 'to everyone' : 'private'} <span class=\"tick\">\u2713\u2713<\/span>`) : ''}<\/div><\/div>`;\n  });\n  const lastEv = c.ev[c.ev.length - 1], lastAt = lastEv && parseClock(lastEv.time);\n  if (!c.broadcast && lastEv?.side === 'in' && !c.team && S.active && lastAt && Date.now() - lastAt < 25e3) html += '<div class=\"bw out\"><div class=\"typing\"><i><\/i><i><\/i><i><\/i><\/div><\/div>';\n  box.innerHTML = html;\n  if (changed || nearBottom) box.scrollTo({ top: box.scrollHeight, behavior: changed ? 'auto' : 'smooth' });\n}\n\nconst prevK = {};\nfunction renderKpis() {\n  const rows = todays(S.log); const c = { timed: 0, reply: 0, number: 0, team: 0 };\n  rows.forEach((r) => { const k = kindOf(r[2]); if (k in c) c[k]++; });\n  c.number = contactsToday().length; // includes numbers typed but not yet thanked\n  const chatters = new Set(rows.filter((r) => String(r[2]).toUpperCase() === 'IN').map((r) => r[3])).size;\n  const askedN = rows.filter((r) => kindOf(r[2]) === 'ask').length;\n  $('#kNumberS').textContent = chatters ? `${Math.round((c.number / chatters) * 100)}% of ${chatters} people who chatted \u00b7 ${askedN} asks sent` : 'of people who chatted';\n  $$('.kpi .v').forEach((el) => {\n    const k = el.dataset.k, v = c[k];\n    if (prevK[k] !== undefined && prevK[k] !== v) { const card = el.closest('.kpi'); card.classList.remove('bump'); void card.offsetWidth; card.classList.add('bump'); }\n    countTo(el, v); prevK[k] = v;\n  });\n  $('#kTimedS').textContent = `of ${S.schedule.length} in this tab`;\n}\nfunction countTo(el, to) {\n  const from = +el.dataset.v || 0; el.dataset.v = to; if (from === to) { el.textContent = to; return; }\n  const t0 = performance.now(), d = 900;\n  const step = (t) => { const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };\n  requestAnimationFrame(step);\n}\n\n// ---------- workflows ----------\nconst WF_INFO = {\n  'webinar-agent.yml': 'Joins the webinar, posts the timed chats, replies to attendees. Start it from the launch sequence.',\n  'session-check.yml': 'Checks the saved Zoom login still works and refreshes it. Runs daily at 8:05 AM.',\n};\nasync function loadWorkflows() {\n  const grid = $('#wfGrid');\n  try {\n    if (isDemo()) {\n      S.workflows = [{ name: 'Webinar chat agent', path: '.github/workflows/webinar-agent.yml', state: 'active' }, { name: 'Zoom session check', path: '.github/workflows/session-check.yml', state: 'active' }, { name: 'AiSensy broadcast sync', path: '.github/workflows/aisensy-sync.yml', state: 'active' }];\n      S.wfRuns = { 'webinar-agent.yml': Demo.run, 'session-check.yml': { status: 'completed', conclusion: 'success', created_at: new Date(Date.now() - 4 * 3600e3).toISOString() }, 'aisensy-sync.yml': { status: 'completed', conclusion: 'success', created_at: new Date(Date.now() - 50 * 60e3).toISOString() } };\n    } else {\n      S.workflows = (await gh(`${repo()}/actions/workflows?per_page=50`)).workflows.filter((w) => w.state === 'active');\n      await Promise.all(S.workflows.map(async (w) => {\n        const f = w.path.split('/').pop();\n        try { S.wfRuns[f] = (await gh(`${repo()}/actions/workflows/${encodeURIComponent(f)}/runs?per_page=1`)).workflow_runs[0] || null; } catch { S.wfRuns[f] = null; }\n      }));\n    }\n    const sc = S.wfRuns['session-check.yml'];\n    if (sc) setPill('#pillZoom', sc.status !== 'completed' ? 'warn' : sc.conclusion === 'success' ? 'ok' : 'bad', sc.conclusion === 'success' ? 'Zoom login OK at the last check' : 'Zoom login check failed \u2013 run save-session again');\n    else setPill('#pillZoom', '', 'No session check yet');\n  } catch (e) { grid.innerHTML = `<div class=\"empty\">${esc(e.message)}<\/div>`; return; }\n  grid.innerHTML = S.workflows.map((w) => {\n    const f = w.path.split('/').pop(), r = S.wfRuns[f], isAgent = f === cfg.workflow;\n    const st = r ? (r.status === 'completed' ? r.conclusion : r.status) : 'never';\n    const when = r ? `${new Date(r.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: TZ })} \u00b7 ${fmtTime(new Date(r.created_at))}` : 'never run';\n    return `<div class=\"wf\" data-tilt><span class=\"file\">${esc(f)}<\/span><h4>${esc(w.name)}<\/h4><p>${esc(WF_INFO[f] || 'GitHub Actions workflow in this repo.')}<\/p>\n      <div class=\"foot\"><span class=\"status ${esc(st)}\"><i><\/i>${esc(String(st).replace('_', ' '))} \u00b7 ${esc(when)}<\/span>\n      ${isAgent ? '<a class=\"btn ghost sm\" href=\"#launch\">Launch \u2191<\/a>' : `<button class=\"btn ghost sm\" data-run=\"${esc(f)}\">Run now<\/button>`}<\/div><\/div>`;\n  }).join('') || '<div class=\"empty\">No active workflows in this repo.<\/div>';\n  $$('[data-run]', grid).forEach((b) => b.addEventListener('click', () => runWorkflow(b.dataset.run, b)));\n  bindTilt(grid);\n}\nasync function runWorkflow(file, btn) {\n  btn.disabled = true; btn.textContent = 'Starting\u2026';\n  try {\n    if (!isDemo()) await gh(`${repo()}/actions/workflows/${encodeURIComponent(file)}/dispatches`, { method: 'POST', body: JSON.stringify({ ref: S.defaultBranch }) });\n    else await sleep(700);\n    toast(`${file} started`); setTimeout(loadWorkflows, 4000);\n  } catch (e) { toast(`${e.message}${/input/i.test(e.message) ? ' (this workflow needs inputs \u2013 start it on GitHub)' : ''}`, true); }\n  btn.disabled = false; btn.textContent = 'Run now';\n}\n\n// ---------- settings ----------\nconst SCRIPT_CODE = `/**\n * Dashboard backend for the FlexiFunnels webinar agent: sheet feed + GitHub actions, behind one team password.\n * Setup: open the chat sheet \u2192 Extensions \u2192 Apps Script \u2192 paste this \u2192 set KEY (the team password) \u2192\n *   Project Settings (\u2699) \u2192 Script properties \u2192 add GITHUB_TOKEN = your dashboard GitHub token \u2192\n *   Deploy \u2192 New deployment \u2192 Web app \u2192 Execute as: Me, Who has access: Anyone \u2192 copy the URL into the loader.\n * Teammates then only type the team password once. The GitHub token never leaves this script.\n */\nconst KEY = 'CHANGE-ME-to-a-long-random-key'; // the team password\nconst REPO = 'Sarthak-B/webinar-chat-automation';\n// The Webinar History sheet's ID (from its URL: /spreadsheets/d/THIS_PART/edit).\n// Leave empty if the agent writes the Summary / Q&A tabs into this same sheet.\nconst HISTORY_SHEET_ID = '';\n// 15 Days First Sale Challenge: day tabs (\"Day 0 Chats\" \u2026) with time | Minute | Second | Name | Role | Messege | Mode,\n// counted from FIFTEEN_START.\nconst FIFTEEN_SHEET_ID = '1T4UCbX34Yyxw14VFcN1xsTMlMnH-ffR0f21BgYegZ5w';\nconst FIFTEEN_START = '7:00 PM';\n\n// Run this ONCE from the editor (select \"authorize\" at the top \u2192 \u25b6 Run) and allow the permissions.\n// It asks Google for every permission the dashboard needs (sheets + calling GitHub).\nfunction authorize() {\n  SpreadsheetApp.getActive().getName();\n  historyBook().getName();\n  UrlFetchApp.fetch('https://api.github.com/zen', { muteHttpExceptions: true });\n  Logger.log('Authorized \u2713 \u2013 now Deploy \u2192 Manage deployments \u2192 \u270f\ufe0f \u2192 New version \u2192 Deploy');\n}\n\nfunction doGet(e) {\n  const p = e.parameter || {};\n  if (p.key !== KEY) return out({ error: 'Wrong key' });\n  const ss = SpreadsheetApp.getActive();\n  try {\n    if (p.book === 'fifteen') {\n      const fb = SpreadsheetApp.openById(FIFTEEN_SHEET_ID);\n      if (p.action === 'tabs') return out({ title: fb.getName(), tabs: fb.getSheets().filter(function (sh) { return /\\\\bday\\\\s*\\\\d+/i.test(sh.getName()); }).map(describeDay).sort(function (a, b) { return a.day - b.day; }) });\n      if (p.action === 'schedule') return out(scheduleDay(fb, p.tab));\n    }\n    if (p.action === 'tabs') return out({ title: ss.getName(), tabs: ss.getSheets().map(describe) });\n    if (p.action === 'schedule') return out(schedule(ss, p.tab));\n    if (p.action === 'rows') return out(rows(ss, p.tab, Number(p.from || 0)));\n    if (p.action === 'history') return out(history());\n    if (p.action === 'historyqa') return out(historyFor('Q&A', p.id));\n    if (p.action === 'gh') return out(github(p.method, p.path, p.body));\n    if (p.action === 'clear') return out(clearData(ss, p.what));\n    if (p.action === 'delwebinar') return out(deleteWebinar(p.id));\n    if (p.action === 'whoami') return out({ ok: true, github: !!githubToken(), repo: REPO });\n    return out({ error: 'Unknown action' });\n  } catch (err) {\n    return out({ error: String(err) });\n  }\n}\n\nfunction headerIndex(values) {\n  for (let i = 0; i < values.length; i++) if (String(values[i][0]).trim().toLowerCase() === 'video time') return i;\n  return -1;\n}\n\nfunction describe(sh) {\n  const n = Math.max(1, Math.min(sh.getLastRow(), 600));\n  const v = sh.getRange(1, 1, n, 4).getDisplayValues();\n  const h = headerIndex(v);\n  if (h < 0) return { name: sh.getName(), schedule: false };\n  const items = v.slice(h + 1).filter(function (r) { return r[1] && r[2]; });\n  return {\n    name: sh.getName(),\n    schedule: true,\n    count: items.length,\n    start: v[0][0],\n    first: items.length ? items[0][1] : '',\n    last: items.length ? items[items.length - 1][1] : '',\n  };\n}\n\nfunction schedule(ss, tab) {\n  const sh = ss.getSheetByName(tab);\n  if (!sh) return { error: 'Tab not found: ' + tab };\n  const v = sh.getRange(1, 1, Math.max(1, Math.min(sh.getLastRow(), 600)), 4).getDisplayValues();\n  const h = headerIndex(v);\n  const items = h < 0 ? [] : v.slice(h + 1).filter(function (r) { return r[1] && r[2]; });\n  return { tab: tab, start: v[0][0], items: items };\n}\n\n// ---- 15 Days day tabs \u2192 same shape as the business tabs: [video time, host time, chat, mode] ----\nfunction dayItems(sh) {\n  const n = Math.max(1, Math.min(sh.getLastRow(), 800));\n  const v = sh.getRange(1, 1, n, Math.max(1, Math.min(sh.getLastColumn(), 10))).getDisplayValues();\n  const norm = function (c) { return String(c || '').trim().toLowerCase(); };\n  let h = -1;\n  for (let i = 0; i < v.length && h < 0; i++) if (v[i].some(function (c) { return norm(c) === 'minute'; })) h = i;\n  if (h < 0) return [];\n  const head = v[h].map(norm);\n  const col = function (re) { for (let i = 0; i < head.length; i++) if (re.test(head[i])) return i; return -1; };\n  const cH = col(/^(time|hour|hours|hr)$/), cM = col(/^minutes?$/), cS = col(/^seconds?$/), cMsg = col(/^mess?[ae]ge?s?$|^message$|^chat$/), cMode = col(/^mode$/);\n  const num = function (r, c) { return c < 0 ? 0 : Number(String(r[c] || '').replace(/[^\\\\d.]/g, '')) || 0; };\n  const m = FIFTEEN_START.match(/(\\\\d{1,2})(?::(\\\\d\\\\d))?\\\\s*([ap]m)?/i);\n  let base = (Number(m[1]) % 12 + (/pm/i.test(m[3] || '') ? 12 : 0)) * 3600 + Number(m[2] || 0) * 60;\n  const out = [];\n  for (let i = h + 1; i < v.length; i++) {\n    const r = v[i], text = String(r[cMsg] || '').trim(), mode = cMode < 0 ? '' : norm(r[cMode]);\n    if (!text || (mode && mode !== 'chat')) continue;\n    const off = num(r, cH) * 3600 + num(r, cM) * 60 + num(r, cS), t = base + off;\n    const hh = Math.floor(t / 3600) % 24, mm = Math.floor((t % 3600) / 60), ss = t % 60;\n    const host = ((hh % 12) || 12) + ':' + ('0' + mm).slice(-2) + ':' + ('0' + ss).slice(-2) + (hh >= 12 ? ' pm' : ' am');\n    const video = Math.floor(off / 3600) + ':' + ('0' + Math.floor((off % 3600) / 60)).slice(-2) + ':' + ('0' + (off % 60)).slice(-2);\n    out.push([video, host, text, mode || 'chat', off]);\n  }\n  out.sort(function (a, b) { return a[4] - b[4]; });\n  return out.map(function (r) { return r.slice(0, 4); });\n}\nfunction describeDay(sh) {\n  const items = dayItems(sh);\n  return { name: sh.getName(), schedule: true, day: Number((sh.getName().match(/day\\\\s*(\\\\d+)/i) || [])[1]), count: items.length, start: '', first: items.length ? items[0][1] : '', last: items.length ? items[items.length - 1][1] : '' };\n}\nfunction scheduleDay(fb, tab) {\n  const sh = fb.getSheetByName(tab);\n  if (!sh) return { error: 'Tab not found: ' + tab };\n  return { tab: tab, start: '', items: dayItems(sh) };\n}\n\n// Rows of \"Agent Log\" / \"Numbers\". First call (from=0): the latest 3000 rows. After that: only rows after \\`from\\`.\nfunction rows(ss, tab, from) {\n  const sh = ss.getSheetByName(tab);\n  if (!sh) return { total: 0, rows: [] };\n  const last = sh.getLastRow();\n  const start = from > 0 ? Math.max(2, from + 1) : Math.max(2, last - 2999);\n  const end = Math.min(last, start + 2999);\n  const data = end >= start ? sh.getRange(start, 1, end - start + 1, sh.getLastColumn()).getDisplayValues() : [];\n  return { total: end, from: start, rows: data };\n}\n\n// ---- Webinar History ----\nfunction historyBook() {\n  return HISTORY_SHEET_ID ? SpreadsheetApp.openById(HISTORY_SHEET_ID) : SpreadsheetApp.getActive();\n}\n// Summary rows (newest last, up to 300) with the header row first.\nfunction history() {\n  const sh = historyBook().getSheetByName('Summary');\n  if (!sh || sh.getLastRow() < 1) return { header: [], rows: [] };\n  const v = sh.getRange(1, 1, sh.getLastRow(), sh.getLastColumn()).getDisplayValues();\n  return { header: v[0], rows: v.slice(1).slice(-300) };\n}\n// Q&A rows for one webinar (column A = Webinar ID).\nfunction historyFor(tab, id) {\n  const sh = historyBook().getSheetByName(tab);\n  if (!sh || sh.getLastRow() < 2) return { header: [], rows: [] };\n  const v = sh.getRange(1, 1, sh.getLastRow(), sh.getLastColumn()).getDisplayValues();\n  return { header: v[0], rows: v.slice(1).filter(function (r) { return r[0] === id; }) };\n}\n\n// ---- Clean-up (dashboard \"Clear\" buttons; permanent \u2013 the dashboard asks first) ----\n// what: chats = Agent Log \u00b7 numbers = Numbers tab + attendee messages that contain a mobile number\n//       history = Summary + Q&A \u00b7 all = everything above\nfunction clearData(ss, what) {\n  const done = [];\n  const wipe = function (sh) {\n    if (!sh) return 0;\n    const n = sh.getLastRow() - 1;\n    if (n > 0) sh.deleteRows(2, n);\n    return Math.max(0, n);\n  };\n  if (what === 'chats' || what === 'all') done.push('chats: ' + wipe(ss.getSheetByName('Agent Log')));\n  if (what === 'numbers' || what === 'all') {\n    done.push('numbers: ' + wipe(ss.getSheetByName('Numbers')));\n    const log = ss.getSheetByName('Agent Log');\n    if (log && what !== 'all' && log.getLastRow() > 1) {\n      const v = log.getRange(2, 1, log.getLastRow() - 1, log.getLastColumn()).getValues();\n      const keep = v.filter(function (r) { return !(String(r[2]).replace(/^DRY /, '') === 'IN' && hasPhone(r[5])); });\n      if (keep.length !== v.length) {\n        log.deleteRows(2, v.length);\n        if (keep.length) { log.insertRowsAfter(1, keep.length); log.getRange(2, 1, keep.length, keep[0].length).setValues(keep); }\n      }\n    }\n  }\n  if (what === 'history' || what === 'all') {\n    const hb = historyBook();\n    done.push('history: ' + wipe(hb.getSheetByName('Summary')));\n    wipe(hb.getSheetByName('Q&A'));\n  }\n  return { ok: true, cleared: done };\n}\nfunction hasPhone(t) {\n  const runs = String(t || '').match(/\\\\+?\\\\d[\\\\d\\\\s-]{8,16}\\\\d/g) || [];\n  return runs.some(function (run) {\n    let d = run.replace(/\\\\D/g, '');\n    if (d.length === 12 && d.indexOf('91') === 0) d = d.slice(2); else if (d.length === 11 && d[0] === '0') d = d.slice(1);\n    return d.length === 10 && /^[6-9]/.test(d);\n  });\n}\nfunction deleteWebinar(id) {\n  if (!id) return { error: 'No webinar id' };\n  const hb = historyBook();\n  let n = 0;\n  ['Summary', 'Q&A'].forEach(function (tab) {\n    const sh = hb.getSheetByName(tab);\n    if (!sh || sh.getLastRow() < 2) return;\n    const v = sh.getRange(2, 1, sh.getLastRow() - 1, 1).getDisplayValues();\n    for (let i = v.length - 1; i >= 0; i--) if (v[i][0] === id) { sh.deleteRow(i + 2); n++; }\n  });\n  return { ok: true, deleted: n };\n}\n\n// ---- GitHub, on the dashboard's behalf (token stays in Script properties) ----\nfunction githubToken() {\n  return PropertiesService.getScriptProperties().getProperty('GITHUB_TOKEN') || '';\n}\n// Only this repo's Actions endpoints (+ the repo itself) can be reached.\nfunction github(method, path, body) {\n  method = String(method || 'GET').toUpperCase();\n  path = String(path || '');\n  const base = '/repos/' + REPO;\n  const okPath = path === base || path.indexOf(base + '/actions/') === 0;\n  if (!okPath || ['GET', 'POST'].indexOf(method) < 0) return { status: 403, data: { message: 'Not allowed: ' + method + ' ' + path } };\n  const token = githubToken();\n  if (!token) return { status: 401, data: { message: 'GITHUB_TOKEN is not set in the Apps Script project properties' } };\n  const opts = {\n    method: method.toLowerCase(),\n    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },\n    muteHttpExceptions: true,\n  };\n  if (body) { opts.payload = body; opts.contentType = 'application/json'; }\n  const res = UrlFetchApp.fetch('https://api.github.com' + path, opts);\n  const text = res.getContentText();\n  let data = null;\n  try { data = text ? JSON.parse(text) : null; } catch (e) { data = { message: text.slice(0, 300) }; }\n  return { status: res.getResponseCode(), data: data };\n}\n\nfunction out(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n`;\nfunction openDrawer() {\n  $('#cOwner').value = cfg.owner; $('#cRepo').value = cfg.repo; $('#cToken').value = cfg.token; $('#cWorkflow').value = cfg.workflow;\n  $('#cScript').value = cfg.script; $('#cScript15').value = cfg.script15 || ''; $('#cKey').value = cfg.key; $('#cSheetUrl').value = cfg.sheetUrl; $('#cHistoryUrl').value = cfg.historyUrl || ''; $('#cDemo').checked = cfg.demo === true;\n  $('#scriptCode').value = SCRIPT_CODE;\n  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');\n}\nfunction closeDrawer() { $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }\nfunction readForm() {\n  return { owner: $('#cOwner').value.trim(), repo: $('#cRepo').value.trim(), token: $('#cToken').value.trim(), workflow: $('#cWorkflow').value.trim() || 'webinar-agent.yml', script: $('#cScript').value.trim(), script15: $('#cScript15').value.trim(), key: $('#cKey').value.trim(), sheetUrl: $('#cSheetUrl').value.trim(), historyUrl: $('#cHistoryUrl').value.trim(), demo: $('#cDemo').checked };\n}\nasync function testConn() {\n  const prev = cfg; cfg = { ...cfg, ...readForm(), demo: false }; const out = [];\n  try { const r = await gh(repo()); out.push(`GitHub \u2713 (${r.full_name})`); } catch (e) { out.push(`GitHub \u2717 ${e.message}`); }\n  try { const d = await feed({ action: 'tabs' }); out.push(`Sheet \u2713 (${d.tabs.filter((t) => t.schedule).length} schedule tabs)`); } catch (e) { out.push(`Sheet \u2717 ${e.message}`); }\n  cfg = prev; toast(out.join(' \u00b7 '), out.some((x) => x.includes('\u2717')));\n}\nasync function saveCfg() {\n  const f = readForm();\n  const need = [['#cOwner', 'Owner', f.owner], ['#cRepo', 'Repo', f.repo], ['#cScript', 'Apps Script web-app URL', f.script], ['#cKey', 'Team password', f.key]];\n  need.forEach(([sel, , v]) => { $(sel).style.borderColor = v || f.demo ? '' : 'var(--red)'; });\n  const missing = need.filter(([, , v]) => !v).map(([, label]) => label);\n  const filled = !missing.length;\n  if (!f.demo && !filled) {\n    const first = need.find(([, , v]) => !v)[0];\n    $(first).scrollIntoView({ behavior: 'smooth', block: 'center' }); $(first).focus();\n    toast(`Still empty: ${missing.join(', ')}`, true); return;\n  }\n  if (f.script && !/^https:\\/\\/script\\.google\\.com\\/macros\\/s\\/.+\\/exec/.test(f.script)) { toast('The Apps Script URL should look like https://script.google.com/macros/s/\u2026/exec', true); return; }\n  // Live data as soon as everything is filled in \u2013 demo only if explicitly switched on.\n  cfg = { ...cfg, ...f, demo: f.demo ? true : false };\n  store.set('autopilot.cfg', cfg); closeDrawer(); toast(cfg.demo ? 'Saved \u2013 showing demo data' : 'Saved \u2013 connected to live data'); boot();\n}\n\n// ---------- team password screen ----------\n// Shown when the shared Apps Script URL is known (from the loader) but this browser has no team password yet.\nfunction needsPassword() { return !!cfg.script && !cfg.key && cfg.demo !== true; }\nfunction showLock() { if (!needsPassword()) return; $('#lock').hidden = false; setTimeout(() => $('#lockKey').focus(), 50); }\n$('#lockForm').addEventListener('submit', async (e) => {\n  e.preventDefault();\n  const key = $('#lockKey').value.trim(); if (!key) return;\n  $('#lockErr').textContent = 'Checking\u2026';\n  const prev = cfg; cfg = { ...cfg, key, demo: false };\n  try {\n    const r = await feed({ action: 'whoami' });\n    if (!r.ok) throw new Error('Wrong password');\n    store.set('autopilot.cfg', { ...store.get('autopilot.cfg', {}), key, demo: false });\n    $('#lock').hidden = true; $('#lockErr').textContent = '';\n    toast(r.github ? 'Unlocked \u2013 connected to live data' : 'Unlocked \u2013 but GITHUB_TOKEN is missing in the Apps Script'); boot();\n  } catch (err) {\n    cfg = prev; $('#lockErr').textContent = /wrong key|wrong password/i.test(err.message) ? 'That password isn\\'t right.' : `Couldn't reach the Apps Script: ${err.message}`;\n  }\n});\n$('#lockDemo').addEventListener('click', () => { $('#lock').hidden = true; });\n\n// ---------- UI helpers ----------\nfunction toast(msg, err) {\n  const t = document.createElement('div'); t.className = `toast ${err ? 'err' : ''}`; t.textContent = msg;\n  $('#toasts').appendChild(t); setTimeout(() => { t.style.transition = '.4s'; t.style.opacity = 0; setTimeout(() => t.remove(), 400); }, err ? 6000 : 3000);\n}\nfunction bindTilt(root) {\n  $$('[data-tilt]', root).forEach((el) => {\n    el.addEventListener('pointermove', (e) => {\n      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;\n      el.style.setProperty('--mx', `${x * 100}%`); el.style.setProperty('--my', `${y * 100}%`);\n      el.style.transform = `perspective(900px) rotateX(${(0.5 - y) * 6}deg) rotateY(${(x - 0.5) * 8}deg) translateY(-3px)`;\n    });\n    el.addEventListener('pointerleave', () => { el.style.transform = ''; });\n  });\n}\nfunction splitWords() {\n  $$('[data-split]').forEach((h) => {\n    if (h.dataset.done) return; h.dataset.done = 1;\n    let i = 0;\n    const walk = (node) => {\n      [...node.childNodes].forEach((n) => {\n        if (n.nodeType === 3) {\n          const frag = document.createDocumentFragment();\n          n.textContent.split(/(\\s+)/).forEach((part) => {\n            if (!part) return;\n            if (/^\\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }\n            const w = document.createElement('span'); w.className = 'w';\n            const s = document.createElement('span'); s.textContent = part; s.style.transitionDelay = `${i++ * 70}ms`;\n            w.appendChild(s); frag.appendChild(w);\n          });\n          n.replaceWith(frag);\n        } else if (n.nodeType === 1) walk(n);\n      });\n    };\n    walk(h);\n  });\n}\nfunction observe() {\n  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .15, rootMargin: '0px 0px -40px 0px' });\n  $$('[data-reveal],[data-split]').forEach((el, i) => { if (el.hasAttribute('data-reveal')) el.style.transitionDelay = `${(i % 4) * 90}ms`; io.observe(el); });\n}\nfunction moveGlider() {\n  const on = $('#filters .on'), g = $('#filters .glider'); if (!on) return;\n  g.style.left = `${on.offsetLeft}px`; g.style.width = `${on.offsetWidth}px`;\n}\n\n// ---------- boot ----------\nlet timers = [];\nasync function boot() {\n  timers.forEach(clearInterval); timers = [];\n  document.body.classList.toggle('is-demo', isDemo()); $('#pillDemo').hidden = !isDemo();\n  S.log = []; S.logTotal = 0; S.numbers = []; S.numTotal = 0; H.list = []; H.loadedFor = null; seenRows.clear(); firstPaint = true;\n  setSheetLink();\n  if (isDemo()) { Demo.log.length = 0; }\n  if (!isDemo()) { try { S.defaultBranch = (await gh(repo())).default_branch || 'main'; } catch (e) { setPill('#pillGh', 'bad', e.message); } }\n  await loadTabs();\n  const last = store.get(`autopilot.lastTab.${S.webinar}`, store.get('autopilot.lastTab', null));\n  if (S.tabs.length) await selectTab(S.tabs.some((t) => t.name === last) ? last : S.tabs[0].name);\n  await Promise.all([loadRuns(), loadFeed(), loadWorkflows(), loadHistoryList()]);\n  timers.push(setInterval(() => loadRuns(), 10_000));\n  timers.push(setInterval(() => { if (!document.hidden) loadFeed(); }, isDemo() ? 4_000 : 3_000)); // live chats every 3 s (paused while this tab is hidden)\n  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadFeed(); });\n  timers.push(setInterval(() => loadWorkflows(), 60_000));\n  timers.push(setInterval(() => loadHistoryList(), isDemo() ? 20_000 : 60_000));\n}\nsetInterval(() => {\n  const now = new Date(); $('#orbClock').textContent = `${fmtFull(now)} IST`; $('#footClock').textContent = now.toLocaleString('en-IN', { timeZone: TZ });\n  tickSchedule();\n  if (S.armed && Date.now() >= S.armed.at && !S.active) {\n    const a = S.armed; S.armed = null; store.set('autopilot.armed', null);\n    if (S.tab?.name === a.tab) { S.mode = a.mode; launch(); }\n  }\n  if (S.tab) renderLaunch();\n}, 1000); et.cf; renderConversations(); });\n$('#convList').addEventListener('click', (e) => { const b = e.target.closest('[data-conv]'); if (!b) return; S.conv = b.dataset.conv; renderConversations(true); });\ndocument.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeDrawer(); $('#mNo').click(); } });\nwindow.addEventListener('resize', moveGlider);\n// In-page links (#launch, #live \u2026) scroll here ourselves. Inside a frame (e.g. the FlexiFunnels page) the browser\n// would resolve \"#launch\" against the host page's address and the click would do nothing.\ndocument.addEventListener('click', (e) => {\n  const a = e.target.closest('a[href^=\"#\"]');\n  if (!a) return;\n  const id = a.getAttribute('href').slice(1);\n  const el = id ? document.getElementById(id) : document.body;\n  if (!el) return;\n  e.preventDefault();\n  const top = el.getBoundingClientRect().top + window.scrollY - ($('.top')?.offsetHeight || 0) + 1;\n  window.scrollTo({ top: id === 'top' ? 0 : top, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });\n});\n\n// arrival\nS.armed = store.get('autopilot.armed', null);\nsplitWords();\nshowLock();\nconst reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\nsetTimeout(() => { $('#curtain').classList.add('up'); setTimeout(() => { $('#curtain').remove(); }, 1100); observe(); moveGlider(); }, reduce ? 0 : 950);\nboot();\n})();\n<\/script>\n<\/body>\n<\/html>\n";
