name: Webinar chat agent
run-name: "${{ inputs.auto_slot != '' && format('Webinar agent · auto {0}', inputs.auto_slot == 'morning' && 'Sunday 11 AM' || '7:30 PM') || format('Webinar agent · {0}{1} · {2}', inputs.webinar == 'fifteen' && '15 Days · ' || '', inputs.tab, inputs.mode) }}"

# Started from the dashboard (or Actions → Run workflow). It always asks which tab to read first.
# Joins through the universal link https://sb.flexifunnels.com/genie-demo (redirects to the live webinar).
# Start it up to ~45 min before the first chat in the tab – the agent waits, then joins 5 min early.
on:
  # Automatic runs (UTC times). India = UTC+5:30.
  #   every day 13:05 UTC = 6:35 PM IST  → the 7:30 PM webinar
  #   Sunday   04:35 UTC = 10:05 AM IST → the 11 AM webinar
  # Which tab + mode each one uses (or switching one off) = the "Auto Schedule" tab in the sheet.
  # Automatic runs are started by the sheet's Apps Script (installAutoStart in apps-script/Code.gs) at ~6:35 PM
  # daily and ~10:05 AM on Sunday – GitHub's own schedule never fired for this repo, so it isn't used.
  workflow_dispatch:
    inputs:
      webinar:
        description: 'Which webinar: business = 10 Min Business (FlexiGenie) · fifteen = 15 Days First Sale Challenge'
        type: choice
        options: ['business', 'fifteen']
        default: 'business'
      zoom_account:
        description: 'Zoom account for this run: auto = 10 Min Business → ZOOM_EMAIL (marketing@), 15 Days → ZOOM_EMAIL_FIFTEEN (arman@). Pick one to override (tests).'
        type: choice
        options: ['auto', 'marketing', 'arman']
        default: 'auto'
      tab:
        description: 'Sheet tab to read the timed chats from (exact name, e.g. "Variant 3 – 11 AM")'
        required: true
      mode:
        description: 'dry = send nothing · timed = timed chats + numbers only · full = everything incl. AI replies'
        type: choice
        options: ['dry', 'timed', 'full']
        default: 'dry'
      join_url:
        description: 'Optional: a different join link OR the webinar ID (e.g. 812 3456 7890) for this run. Leave empty to use the universal link'
        required: false
        default: ''
      test_from_now:
        description: 'Test: move the tab''s timed chats so they start ~2 min after launch (pricing lock moves too)'
        type: boolean
        default: false
      direct_url:
        description: 'Optional: direct Zoom webinar link or ID. Skips the universal link and the wait – joins right away as the host account, and stays until the webinar ends'
        required: false
        default: ''
      auto_slot:
        description: 'Set by the automatic start only: evening (7:30 PM) or morning (Sunday 11 AM) – tab and mode then come from the sheet''s Auto Schedule tab'
        required: false
        default: ''

# One webinar at a time
concurrency:
  group: webinar-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest # always GitHub's cloud servers
    timeout-minutes: 355
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium

      # Each webinar has its own Zoom account: 10 Min Business → ZOOM_SESSION_B64,
      # 15 Days Challenge → ZOOM_SESSION_B64_FIFTEEN. Never falls back to the other account's login.
      - name: Restore Zoom session
        env:
          S_BUSINESS: ${{ secrets.ZOOM_SESSION_B64 }}
          S_FIFTEEN: ${{ secrets.ZOOM_SESSION_B64_FIFTEEN }}
          W: ${{ inputs.webinar || 'business' }}
          A: ${{ inputs.zoom_account || 'auto' }}
        run: |
          if [ "$A" = "arman" ] || { [ "$A" = "auto" ] && [ "$W" = "fifteen" ]; }; then ZOOM_SESSION_B64="$S_FIFTEEN"; else ZOOM_SESSION_B64="$S_BUSINESS"; fi
          # a missing/broken session is OK when the email + password secrets are set (the agent signs in)
          if [ -n "$ZOOM_SESSION_B64" ] && echo "$ZOOM_SESSION_B64" | base64 -d | gunzip > zoom-session.json 2>/dev/null; then :; else echo '{}' > zoom-session.json; fi
          chmod 600 zoom-session.json

      - name: Hide pasted Zoom link from logs
        if: inputs.join_url != '' || inputs.direct_url != ''
        env:
          J: ${{ inputs.join_url }}
          D: ${{ inputs.direct_url }}
        run: |
          [ -n "$J" ] && echo "::add-mask::$J" || true
          [ -n "$D" ] && echo "::add-mask::$D" || true

      - name: Run agent
        env:
          SCHEDULE_TAB: ${{ inputs.tab }}
          WEBINAR: ${{ inputs.webinar || 'business' }}
          ZOOM_ACCOUNT: ${{ inputs.zoom_account || 'auto' }}
          AUTO_SLOT: ${{ inputs.auto_slot }}
          # Universal link https://sb.flexifunnels.com/genie-demo is the built-in default; a ZOOM_JOIN_URL variable or the join_url input overrides it
          ZOOM_JOIN_URL: ${{ inputs.join_url != '' && inputs.join_url || vars.ZOOM_JOIN_URL }}
          # Optional: the agent account's personal panelist link (gives panelist powers)
          ZOOM_PANELIST_URL: ${{ secrets.ZOOM_PANELIST_URL }}
          ZOOM_DIRECT_URL: ${{ inputs.direct_url }}
          ZOOM_PROXY: ${{ secrets.ZOOM_PROXY }}
          ZOOM_EMAIL: ${{ secrets.ZOOM_EMAIL }}
          ZOOM_PASSWORD: ${{ secrets.ZOOM_PASSWORD }}
          ZOOM_EMAIL_FIFTEEN: ${{ secrets.ZOOM_EMAIL_FIFTEEN }}
          ZOOM_PASSWORD_FIFTEEN: ${{ secrets.ZOOM_PASSWORD_FIFTEEN }}
          TEST_FROM_NOW: ${{ inputs.test_from_now }}
          AGENT_EMAIL: ${{ vars.AGENT_EMAIL || secrets.AGENT_EMAIL }}
          DRY_RUN: ${{ inputs.mode == 'dry' }}
          AUTO_REPLY: ${{ inputs.mode == 'full' }}
          SHEET_ID: ${{ vars.SHEET_ID || secrets.SHEET_ID }}
          HISTORY_SHEET_ID: ${{ vars.HISTORY_SHEET_ID || secrets.HISTORY_SHEET_ID }}
          MODE: ${{ inputs.mode }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_MODEL_BACKUP: ${{ vars.GROQ_MODEL_BACKUP }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: ${{ vars.KIMI_MODEL || secrets.KIMI_MODEL }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || secrets.DEEPSEEK_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          PERSONA_NAME: ${{ vars.PERSONA_NAME || secrets.PERSONA_NAME }}
          AGENT_NAME: ${{ vars.AGENT_NAME || secrets.AGENT_NAME }}
          TEAM_NAMES: ${{ vars.TEAM_NAMES || secrets.TEAM_NAMES }}
          MAX_RUNTIME_MIN: 345
          # Optional tuning – set any of these as repo Variables to override the defaults (empty = default)
          HUMANIZE: ${{ vars.HUMANIZE }}
          MAX_PRIVATE_PER_MIN: ${{ vars.MAX_PRIVATE_PER_MIN }}
          MAX_ASKS_PER_MIN: ${{ vars.MAX_ASKS_PER_MIN }}
          SEND_GAP_MS: ${{ vars.SEND_GAP_MS }}
          ATTENDEE_COOLDOWN_SEC: ${{ vars.ATTENDEE_COOLDOWN_SEC }}
          NUMBER_NUDGES: ${{ vars.NUMBER_NUDGES }}
          NUDGE_AFTER_MESSAGES: ${{ vars.NUDGE_AFTER_MESSAGES }}
          NUDGE_MAX: ${{ vars.NUDGE_MAX }}
          NUDGE_GAP_MIN: ${{ vars.NUDGE_GAP_MIN }}
          SOCIAL_PROOF_EVERY_MIN: ${{ vars.SOCIAL_PROOF_EVERY_MIN }}
          OBJECTION_THRESHOLD: ${{ vars.OBJECTION_THRESHOLD }}
          OBJECTION_COOLDOWN_MIN: ${{ vars.OBJECTION_COOLDOWN_MIN }}
          JOIN_EARLY_MIN: ${{ vars.JOIN_EARLY_MIN }}
          LATE_GRACE_SEC: ${{ vars.LATE_GRACE_SEC }}
          NUMBER_UNLOCK_MIN: ${{ vars.NUMBER_UNLOCK_MIN }}
          PRICE_UNLOCK_MIN: ${{ vars.PRICE_UNLOCK_MIN }}
          PRICE_DEFER_MIN: ${{ vars.PRICE_DEFER_MIN }}
        # Zoom's web client behaves better in a real (virtual) display than in headless mode.
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npm run agent

      # Screenshots + chat-panel HTML the agent saved when it couldn't read the chat (kept 3 days)
      - name: Upload debug snapshots
        if: always() && hashFiles('debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-debug
          path: debug/
          retention-days: 3

      # Zoom renews its cookies while we use it – store the fresh copy so the login doesn't expire.
      - name: Save refreshed Zoom session
        if: always() && hashFiles('.session-ok') != ''
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          W: ${{ inputs.webinar || 'business' }}
          A: ${{ inputs.zoom_account || 'auto' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SECRETS_PAT not set – skipping session refresh"; exit 0; fi
          NAME=ZOOM_SESSION_B64
          if [ "$A" = "arman" ] || { [ "$A" = "auto" ] && [ "$W" = "fifteen" ]; }; then NAME=ZOOM_SESSION_B64_FIFTEEN; fi
          gzip -c zoom-session.json | base64 | tr -d "\n" | gh secret set "$NAME" --repo "$GITHUB_REPOSITORY"
          echo "Session secret refreshed"

      - name: Wipe session file
        if: always()
        run: rm -f zoom-session.json .session-ok
      # No artifacts are uploaded on purpose: traces/screenshots can contain the Zoom session.
