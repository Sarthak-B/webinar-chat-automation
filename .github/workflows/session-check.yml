name: Zoom session keep-alive

# Every 6 hours: open Zoom with each saved login so it stays active, and save the refreshed cookies back.
# A login that's used regularly lasts much longer than one that sits unused between webinars.
# If a login has expired, this job fails → GitHub emails you, so you can run refresh-session.sh before the webinar.
on:
  # started every 6 h by the sheet's Apps Script (keepZoomAlive, set up by installAutoStart)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest # always GitHub's cloud servers
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        account: [business, fifteen, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - shell: bash
        run: |
          npx playwright install --with-deps chromium

      - name: Restore session
        id: restore
        env:
          S_BUSINESS: ${{ secrets.ZOOM_SESSION_B64 }}
          S_FIFTEEN: ${{ secrets.ZOOM_SESSION_B64_FIFTEEN }}
          S_ADMIN: ${{ secrets.ZOOM_SESSION_B64_ADMIN }}
          HAS_LOGIN: ${{ matrix.account == 'admin' && secrets.ZOOM_EMAIL_ADMIN != '' || matrix.account == 'fifteen' && secrets.ZOOM_EMAIL_FIFTEEN != '' || matrix.account == 'business' && secrets.ZOOM_EMAIL != '' }}
          ACC: ${{ matrix.account }}
        run: |
          case "$ACC" in fifteen) S="$S_FIFTEEN"; N=ZOOM_SESSION_B64_FIFTEEN;; admin) S="$S_ADMIN"; N=ZOOM_SESSION_B64_ADMIN;; *) S="$S_BUSINESS"; N=ZOOM_SESSION_B64;; esac
          echo "name=$N" >> "$GITHUB_OUTPUT"
          if [ -n "$S" ]; then echo "$S" | base64 -d | gunzip > zoom-session.json; exit 0; fi
          # no saved login yet: still check it by signing in with the email + password secrets (if they're set)
          if [ "$HAS_LOGIN" = "true" ]; then echo '{}' > zoom-session.json; else echo "No saved session or login for $ACC yet – skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - name: Check login
        if: steps.restore.outputs.skip != '1'
        env:
          ZOOM_PROXY: ${{ secrets.ZOOM_PROXY }}
          # signs in again by itself if the saved login has expired
          ZOOM_EMAIL: ${{ matrix.account == 'fifteen' && secrets.ZOOM_EMAIL_FIFTEEN || matrix.account == 'admin' && secrets.ZOOM_EMAIL_ADMIN || secrets.ZOOM_EMAIL }}
          ZOOM_PASSWORD: ${{ matrix.account == 'fifteen' && secrets.ZOOM_PASSWORD_FIFTEEN || matrix.account == 'admin' && secrets.ZOOM_PASSWORD_ADMIN || secrets.ZOOM_PASSWORD }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" npm run check-session

      - name: Save refreshed session
        if: steps.restore.outputs.skip != '1' && success()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          NAME: ${{ steps.restore.outputs.name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SECRETS_PAT not set – skipping refresh"; exit 0; fi
          gzip -c zoom-session.json | base64 | tr -d "\n" | gh secret set "$NAME" --repo "$GITHUB_REPOSITORY"

      - name: Wipe session file
        if: always()
        run: rm -f zoom-session.json
