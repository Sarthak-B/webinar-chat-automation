name: Zoom session check

# Every morning: make sure the saved Zoom login still works, and refresh it.
# If it's logged out, this job fails → GitHub emails you, so you can re-run save-session before the webinar.
on:
  schedule:
    - cron: '35 2 * * *'  # 8:05 AM IST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Restore session
        env:
          ZOOM_SESSION_B64: ${{ secrets.ZOOM_SESSION_B64 }}
        run: echo "$ZOOM_SESSION_B64" | base64 -d | gunzip > zoom-session.json

      - name: Check login
        run: npm run check-session

      - name: Save refreshed session
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SECRETS_PAT not set – skipping refresh"; exit 0; fi
          gzip -c zoom-session.json | base64 -w0 | gh secret set ZOOM_SESSION_B64 --repo "$GITHUB_REPOSITORY"

      - name: Wipe session file
        if: always()
        run: rm -f zoom-session.json
